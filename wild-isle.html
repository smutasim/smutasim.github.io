<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wild Isle Zoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sea1:#2b8896; --sea2:#4fb3bf;
  --panel:#fdf8ec; --panel2:#f4ead2;
  --ink:#243b31; --ink2:#5a6e60;
  --pine:#2f4f3e; --pine2:#3d6450;
  --gold:#f5c542; --gold-d:#c99a1e;
  --star:#9a6bde; --star-d:#7b4fc4;
  --good:#4d9e5f; --bad:#c85a4a;
  --shadow:0 6px 18px rgba(20,50,45,.25);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Nunito',system-ui,-apple-system,sans-serif;
  background:radial-gradient(120% 90% at 50% 30%, #5cc4cf, #2f97a6 55%, #1f7584 100%);
  color:var(--ink);
  user-select:none;-webkit-user-select:none;
  touch-action:none;
}
h1,h2,h3,.disp{font-family:'Fredoka','Nunito',system-ui,sans-serif;}

/* ---------- viewport / world ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;}
#worldSvg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;}
#worldSvg.dragging{cursor:grabbing;}
.coinPulse{animation:coinbob 1.4s ease-in-out infinite;}
@keyframes coinbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.waves{animation:wavedrift 9s ease-in-out infinite alternate;}
@keyframes wavedrift{from{transform:translate(0,0)}to{transform:translate(26px,8px)}}
.foam{animation:foam 3.2s ease-in-out infinite;}
@keyframes foam{0%,100%{opacity:.85}50%{opacity:.35}}
.sparkleT{animation:twinkle 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.placeGhost{opacity:.55;pointer-events:none;}
#clouds{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden;}
.cloud{position:absolute;left:-260px;width:220px;height:70px;opacity:.38;animation:cloudmove linear infinite;}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%;}
.cloud::before{width:120px;height:56px;left:20px;top:12px;box-shadow:60px 6px 0 -6px #fff,-14px 14px 0 -12px #fff;}
.cloud::after{width:70px;height:62px;left:70px;top:-6px;}
@keyframes cloudmove{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 520px))}}
@media (prefers-reduced-motion: reduce){ .coinPulse,.bob,.waves,.foam,.cloud,.sparkleT{animation:none} }

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;padding:10px 10px 0;z-index:20;pointer-events:none;align-items:flex-start;flex-wrap:wrap;}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;background:linear-gradient(#fffdf6,var(--panel));border:2px solid rgba(47,79,62,.18);border-radius:999px;padding:5px 12px 5px 7px;box-shadow:var(--shadow);font-weight:800;font-size:15px;transition:transform .15s;}
.chip svg{display:block}
.chip .sub{font-size:10.5px;font-weight:700;color:var(--ink2);margin-left:2px;}
.chip.pulse{animation:chippulse .35s ease-out;}
@keyframes chippulse{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
#chipLv{padding:4px 12px 4px 4px;gap:7px;cursor:pointer;}
#chipLv .lvBadge{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe58a,#f0b429 60%,#c98a12);color:#6b4500;font-family:'Fredoka',sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;border:2px solid #fff6d6;box-shadow:0 2px 0 #b07a10;}
#chipLv .xpWrap{width:74px;height:9px;border-radius:6px;background:#e6dcc2;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15);}
#chipLv .xpFill{height:100%;background:linear-gradient(90deg,#5cc46e,#9be07a);border-radius:6px;transition:width .4s;}
#chipLv .xpTxt{font-size:10px;font-weight:800;color:var(--ink2);line-height:1;margin-top:2px;}
#zoomBtns{margin-left:auto;display:flex;gap:6px;pointer-events:auto;}
.rndBtn{width:38px;height:38px;border-radius:12px;border:2px solid rgba(47,79,62,.18);background:linear-gradient(#fffdf6,var(--panel));font-size:19px;font-weight:800;color:var(--pine);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Fredoka',sans-serif;}
.rndBtn.toggled{background:var(--panel2);opacity:0.6;}
.rndBtn:active{transform:scale(.9);}

/* ---------- bottom nav ---------- */
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:20;justify-content:center;pointer-events:none;}
.navBtn{pointer-events:auto;position:relative;flex:1;max-width:110px;background:linear-gradient(#4a7a60,var(--pine));color:#fff;border:2px solid rgba(255,255,255,.18);border-radius:18px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.02em;box-shadow:0 4px 0 #1e372b, var(--shadow);cursor:pointer;}
.navBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #1e372b;}
.navBtn.toggled{background:linear-gradient(#e0b23a,var(--gold-d));box-shadow:0 4px 0 #93700f,var(--shadow);}
.navBtn .ico{font-size:20px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}
.badge{position:absolute;top:-6px;right:-4px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--panel);}

/* ---------- modal ---------- */
#modalWrap{position:fixed;inset:0;background:rgba(18,42,38,.45);z-index:40;display:none;align-items:flex-end;justify-content:center;}
#modalWrap.open{display:flex;}
#modal{background:var(--panel);width:100%;max-width:560px;max-height:82vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 40px rgba(0,0,0,.3);animation:slideup .22s ease-out;}
@keyframes slideup{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
#modalHead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:2px solid var(--panel2);}
#modalHead h2{font-size:20px;color:var(--pine);font-weight:600;flex:1;}
#modalClose{width:34px;height:34px;border-radius:12px;border:none;background:var(--panel2);font-size:17px;font-weight:800;color:var(--ink2);cursor:pointer;}
#modalBody{overflow-y:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;touch-action:pan-y;}
.tabs{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap;}
.tab{border:none;background:var(--panel2);color:var(--ink2);font-family:'Fredoka',sans-serif;font-weight:600;font-size:13.5px;padding:7px 13px;border-radius:999px;cursor:pointer;}
.tab.on{background:var(--pine);color:#fff;}

/* ---------- cards ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.card{background:#fff;border:2px solid var(--panel2);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.card .nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;color:var(--pine);line-height:1.15;}
.card .meta{font-size:11.5px;color:var(--ink2);font-weight:700;}
.aw{width:86px;height:72px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#dff0d2,#c9e4b6);border-radius:12px;overflow:hidden;}
.aw.silh svg{filter:brightness(0);opacity:.45;}
.buyBtn{border:none;border-radius:999px;padding:6px 14px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:#fff;background:var(--good);box-shadow:0 3px 0 #35753f;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.buyBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #35753f;}
.buyBtn.star{background:var(--star);box-shadow:0 3px 0 var(--star-d);}
.buyBtn.warn{background:var(--bad);box-shadow:0 3px 0 #96382b;}
.buyBtn.ghost{background:var(--panel2);color:var(--ink2);box-shadow:0 3px 0 #d8caa6;}
.buyBtn:disabled,.buyBtn.star:disabled,.buyBtn.short{background:#b7bdb4;box-shadow:0 3px 0 #8f958c;opacity:.85;}
.buyBtn svg{flex:none;}
.card.locked{background:#f6f1e4;}
.card.locked .nm{color:var(--ink2);}
.lockTag{font-size:12px;font-weight:800;color:#8a7a52;background:#efe4c6;border-radius:999px;padding:5px 12px;}
.newTag{position:absolute;top:6px;left:6px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px;}
.card{position:relative;}
.rowBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}

/* ---------- info sheet ---------- */
.sheetRow{display:flex;align-items:center;gap:12px;padding:6px 2px;}
.statLine{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--ink2);padding:4px 2px;border-bottom:1px dashed var(--panel2);}
.statLine b{color:var(--ink);}
.barWrap{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:6px 0 2px;}
.bar{height:100%;background:linear-gradient(90deg,var(--gold),#ffdd7a);border-radius:6px;}

/* ---------- missions ---------- */
.mis{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--panel2);border-radius:14px;padding:10px 12px;margin-bottom:8px;}
.mis .t{flex:1;font-weight:700;font-size:13.5px;}
.mis.done{border-color:#cfe6c6;background:#f2faee;}
.mis .claimed{font-size:12px;font-weight:800;color:var(--good);}

/* ---------- hatchery ---------- */
.slot{background:#fff;border:2px solid var(--panel2);border-radius:16px;padding:12px;margin-bottom:10px;}
.slot .hd{display:flex;align-items:center;gap:8px;font-family:'Fredoka',sans-serif;font-weight:600;color:var(--pine);}
.eggWrap{display:flex;align-items:center;gap:12px;margin-top:8px;}
.recipeRow{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--panel2);border-radius:14px;padding:8px 10px;margin-bottom:8px;}
.recipeRow .plus{font-weight:800;color:var(--ink2);}
.miniA{width:52px;height:46px;display:flex;align-items:flex-end;justify-content:center;background:#eef5e6;border-radius:10px;overflow:hidden;flex:none;}
.miniA.silh svg{filter:brightness(0);opacity:.4;}

/* ---------- toast & fx ---------- */
#toasts{position:fixed;top:64px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none;}
.toast{background:var(--pine);color:#fff;font-weight:700;font-size:13.5px;padding:8px 16px;border-radius:999px;box-shadow:var(--shadow);animation:toastin .25s ease-out;max-width:88vw;text-align:center;}
@keyframes toastin{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
.fly{position:fixed;font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);z-index:70;pointer-events:none;animation:flyup .9s ease-out forwards;display:flex;align-items:center;gap:4px;}
.fly svg{flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
@keyframes flyup{from{transform:translateY(0);opacity:1}to{transform:translateY(-46px);opacity:0}}

.coinFly{position:fixed;left:0;top:0;width:20px;height:20px;z-index:72;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.7,1),opacity .7s;}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:95;pointer-events:none;border-radius:2px;animation:confall linear forwards;}
@keyframes confall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));}}

/* ---------- dialogs (confirm / level-up / win) ---------- */
#dlgWrap{position:fixed;inset:0;background:rgba(18,42,38,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:16px;}
#dlgWrap.open{display:flex;}
#dlg{background:var(--panel);border-radius:22px;max-width:380px;width:100%;padding:18px 18px 16px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:dlgpop .3s cubic-bezier(.3,1.5,.5,1);max-height:88vh;overflow-y:auto;}
@keyframes dlgpop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#dlg h2{font-size:24px;color:var(--pine);margin-bottom:6px;}
#dlg p{font-size:14px;font-weight:700;color:var(--ink2);line-height:1.4;margin-bottom:12px;}
#dlg .big{font-size:52px;line-height:1.1;margin-bottom:4px;}
.unlockRow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 12px;}
.unlockRow .u{width:92px;background:#fff;border:2px solid var(--panel2);border-radius:14px;padding:6px 4px;font-size:11.5px;font-weight:800;color:var(--pine);}
.rewardRow{display:flex;gap:10px;justify-content:center;margin-bottom:12px;font-weight:800;font-size:16px;}
.rewardRow span{display:flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:5px 12px;border:2px solid var(--panel2);}
.setRow{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--panel2);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-weight:800;color:var(--pine);}
.hint{font-size:12.5px;color:var(--ink2);font-weight:700;text-align:center;padding:6px 10px;}
.secH{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--pine);font-size:15px;margin:12px 2px 8px;}

/* ---------- placement confirm bar ---------- */
#confirmBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:30;display:none;align-items:center;gap:10px;background:var(--panel);border:2px solid rgba(47,79,62,.18);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:var(--shadow);font-weight:800;font-size:14px;color:var(--pine);}
#confirmBar.on{display:flex;}
#confirmBar button{width:42px;height:42px;border-radius:50%;border:none;font-size:19px;font-weight:800;color:#fff;cursor:pointer;}
#okBtn{background:var(--good);box-shadow:0 3px 0 #35753f;}
#okBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #35753f;}
#okBtn:disabled{background:#b7bdb4;box-shadow:0 3px 0 #8f958c;}
#noBtn{background:var(--bad);box-shadow:0 3px 0 #96382b;}
#noBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #96382b;}
@media (max-height:480px){
  #hud{padding:6px 8px 0;}
  .chip{padding:4px 10px 4px 6px;font-size:13px;}
  #nav{padding:6px 10px calc(6px + env(safe-area-inset-bottom));}
  .navBtn{padding:6px 4px 5px;font-size:11.5px;}
  .navBtn .ico{font-size:16px;}
  #modal{max-height:92vh;}
  #confirmBar{bottom:calc(70px + env(safe-area-inset-bottom));}
}
</style>
</head>
<body>
<div id="viewport">
  <svg id="worldSvg" draggable="false" ondragstart="return false">
  <g id="gRoot"><g id="gSea"></g><g id="gWorld"></g><g id="gVis"></g><g id="gFront"></g><g id="gFx"></g></g></svg>
</div>
<div id="clouds"><div class="cloud" style="top:14%;animation-duration:95s;animation-delay:-20s"></div><div class="cloud" style="top:46%;animation-duration:130s;animation-delay:-80s;transform:scale(.7)"></div><div class="cloud" style="top:72%;animation-duration:110s;animation-delay:-50s"></div></div>

<div id="hud">
  <div class="chip" id="chipLv" title="Level"></div>
  <div class="chip" id="chipGold"></div>
  <div class="chip" id="chipStar"></div>
  <div class="chip" id="chipRate"></div>
  <div id="zoomBtns">
    <button class="rndBtn" id="musicBtn" title="Music on/off">🎵</button>
    <button class="rndBtn" id="recenterBtn" title="Recenter">🎯</button>
    <button class="rndBtn" id="zin" title="Zoom in">+</button>
    <button class="rndBtn" id="zout" title="Zoom out">−</button>
    <button class="rndBtn" id="setBtn" title="Settings & help">⚙️</button>
  </div>
</div>

<div id="nav">
  <button class="navBtn" id="nShop"><span class="ico">🛒</span>Shop</button>
  <button class="navBtn" id="nHatch"><span class="ico">🥚</span>Hatchery<span class="badge" id="bHatch" style="display:none"></span></button>
  <button class="navBtn" id="nMis"><span class="ico">📜</span>Missions<span class="badge" id="bMis" style="display:none"></span></button>
  <button class="navBtn" id="nMove"><span class="ico">✋</span>Move</button>
</div>

<div id="modalWrap"><div id="modal">
  <div id="modalHead"><h2 id="modalTitle"></h2><button id="modalClose">✕</button></div>
  <div class="tabs" id="modalTabs" style="display:none"></div>
  <div id="modalBody"></div>
</div></div>

<div id="confirmBar"><span id="confirmLabel">Place here?</span><button id="okBtn">✓</button><button id="noBtn">✕</button></div>
<div id="toasts"></div>
<div id="dlgWrap"><div id="dlg"></div></div>

<script>
'use strict';
if(typeof window.storage==='undefined'){
  window.storage={
    async get(key){
      const v=localStorage.getItem('wiz:'+key);
      if(v===null)throw new Error('not found');
      return {key,value:v};
    },
    async set(key,value){ localStorage.setItem('wiz:'+key,value); return {key}; },
    async delete(key){ localStorage.removeItem('wiz:'+key); return {key,deleted:true}; },
    async list(prefix){
      const keys=Object.keys(localStorage).filter(k=>k.startsWith('wiz:'+(prefix||''))).map(k=>k.slice(4));
      return {keys};
    }
  };
}
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const nowMs=()=>Date.now();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Math.random().toString(36).slice(2,10);
function fmt(n){n=Math.floor(n);
  if(n>=1e9)return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B';
  if(n>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if(n>=1e4)return Math.floor(n/1e3)+'k';
  if(n>=1e3)return (n/1e3).toFixed(1).replace(/\.0$/,'')+'k';
  return ''+n;}
function fmtTime(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);
  if(s<60)return s+'s';
  const m=Math.floor(s/60);if(m<60)return m+'m '+(s%60)+'s';
  const h=Math.floor(m/60);if(h<48)return h+'h '+(m%60)+'m';
  return Math.floor(h/24)+'d '+(h%24)+'h';}
function shade(hex,amt){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');
  const n=parseInt(c,16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}

/* ================= SVG primitives (string builders) ================= */
let artSeq=0;
const R=(x,y,w,h,rx,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}"/>`;
const E=(cx,cy,rx,ry,f,extra)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${extra||''}/>`;
const C=(cx,cy,r,f)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"/>`;
const P=(d,f,extra)=>`<path d="${d}" fill="${f}" ${extra||''}/>`;
const LN=(x1,y1,x2,y2,c,w,cap)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="${cap||'round'}"/>`;
const EYE=(x,y,r)=>C(x,y,r||1.7,'#26241f');

/* ---- generic quadruped, side view facing left, ground y=95, canvas 120x100 ---- */
function quadArt(o){
  const G=95, cd=o.cd||shade(o.c,-30), bw=o.bw, bh=o.bh, lg=o.lg, lw=o.lw||6;
  const bcx=64, bcy=G-lg-bh*0.42;
  const cid='cq'+(artSeq++);
  let s='';
  const lx=[bcx-bw*0.35,bcx-bw*0.22,bcx+bw*0.20,bcx+bw*0.33];
  // far legs
  s+=R(lx[1]-lw/2,bcy,lw,G-bcy,lw/2,cd)+R(lx[3]-lw/2,bcy,lw,G-bcy,lw/2,cd);
  // near legs
  s+=R(lx[0]-lw/2,bcy,lw,G-bcy,lw/2,o.legc||o.c)+R(lx[2]-lw/2,bcy,lw,G-bcy,lw/2,o.legc||o.c);
  if(o.hoof){for(const x of lx)s+=R(x-lw/2,G-4.5,lw,4.5,1.5,o.hoof);}
  // tail (behind body)
  const bx2=bcx+bw/2, ty=bcy-bh*0.16;

    if(o.spots){const pts=[[-0.25,-0.15],[0.05,-0.28],[0.28,-0.05],[-0.02,0.12],[0.25,0.24],[-0.3,0.2]];

/* ---- low lizard (croc, komodo, iguana, basilisk) ---- */

/* ---- levels & XP (Tap Zoo style: XP from collecting, buying and hatching) ---- */
const TIER_XP={base:1,bird:1,big:1.2,water:1.2,rept:1.2,hybrid:1.5,myth:2,cap:3};
function xpFor(it){
  if(it.kind==='exhibit')return Math.max(1,Math.round(SP[it.sp].per*0.6*TIER_XP[SP[it.sp].tier]));
  if(it.kind==='store')return Math.max(1,Math.round(STORES[it.sp].per*0.6));
  return 0;
}
const buyXp=cost=>Math.max(1,Math.round(Math.sqrt(cost)*0.6));
const xpNeed=L=>Math.round(12+Math.pow(L,2.1));    // xp to go from level L to L+1
const levelGold=L=>10*L*L;                          // gold gift on reaching level L
const MAX_LV=51;
function unlocksAt(L){
  const out=[];
  for(const k of Object.keys(SP))if(SP[k].lv===L)out.push({kind:'animal',k});
  for(const k of Object.keys(STORES))if(STORES[k].lv===L)out.push({kind:'store',k});
  for(const k of Object.keys(DECOS))if((DECOS[k].lv||0)===L&&L>1)out.push({kind:'deco',k});
  EXP_LV.forEach((l,i)=>{if(i>0&&l===L)out.push({kind:'exp',i});});
  SLOT_LV.forEach((l,i)=>{if(i>0&&l===L)out.push({kind:'slot',i});});
  return out;
}

/* ================= state & persistence ================= */
let state=null;
function freshState(){
  return {v:3,gold:800,stars:3,exp:0,lv:1,xp:0,
    items:[],inv:[{sp:'buffalo'}],
    hatch:{slots:1,breeds:[]},
    trash:[],disc:[],claimed:{},seen:{},
    stats:{gold:0,trash:0,breeds:0,collects:0},
    musicOn:true,sfxOn:true,won:false,
    started:nowMs(),
    seenHelp:false,last:nowMs()};
}
function migrateV2(s){
  // grid grew from 16 to 20: shift everything so it stays anchored to the entrance corner
  const d=20-16;
  for(const it of (s.items||[])){it.x+=d;it.y+=d;}
  for(const t of (s.trash||[])){t.x+=d;t.y+=d;}
  // give a level that covers everything the player already owns
  let lv=1;
  const own=new Set([...(s.items||[]).filter(i=>i.kind==='exhibit').map(i=>i.sp),...(s.disc||[])]);
  for(const k of own)if(SP[k])lv=Math.max(lv,SP[k].lv);
  lv=Math.max(lv,EXP_LV[s.exp||0]||1);
  s.lv=lv;s.xp=0;s.v=3;
  s.stats=Object.assign({collects:0},s.stats||{});
}
let saveT=null,dirty=false,resettingGame=false;
function save(){if(resettingGame)return;dirty=true;clearTimeout(saveT);saveT=setTimeout(doSave,1200);}
async function doSave(){
  if(resettingGame)return;
  if(!dirty)return;dirty=false;
  state.last=nowMs();
  try{await window.storage.set('wild-isle-save',JSON.stringify(state));}catch(e){console.error('save failed',e);}
}
async function loadState(){
  try{const r=await window.storage.get('wild-isle-save');
    if(r&&r.value){const s=JSON.parse(r.value);
      if(s&&(s.v===1||s.v===2||s.v===3)){
        if(s.v===1)migrateV1(s);
        if(s.v===2)migrateV2(s);
        state=Object.assign(freshState(),s);state.v=3;
        if(!state.seen)state.seen={};
        return true;}}
  }catch(e){/* no save yet */}
  state=freshState();return false;
}
async function resetGame(){
  // window.confirm() is silently blocked inside sandboxed iframes, which made this button look dead
  if(!await askConfirm('Start over?','This permanently erases ALL progress on this island: gold, animals, everything. This cannot be undone.','Erase & restart',true))return;
  resettingGame=true;
  clearTimeout(saveT);
  try{musStop();}catch(e){}
  try{await window.storage.delete('wild-isle-save');}catch(e){}
  await new Promise(r=>setTimeout(r,300)); // let any save that was already mid-flight resolve
  try{await window.storage.delete('wild-isle-save');}catch(e){} // then sweep it away for good
  location.reload();
}
function migrateV1(s){
  const items=s.items||[];const exp=s.exp||0;
  const sz=EXP_SIZES[exp],off=(16-sz)/2; // v1 saves predate the 20x20 grid
  const placed=[];
  const fit=(x,y,f)=>{
    if(x<off||y<off||x+f>off+sz||y+f>off+sz)return false;
    for(const q of placed){const qf=q.f||1;
      if(x<q.x+qf&&x+f>q.x&&y<q.y+qf&&y+f>q.y)return false;}
    return true;};
  for(const it of items){
    if(it.kind==='exhibit'){it.f=SP[it.sp].f;it.next=nowMs()+SP[it.sp].per*60000;delete it.last;}
    else if(it.kind==='store'){it.f=STORES[it.sp].f;it.next=nowMs()+STORES[it.sp].per*60000;delete it.last;}
    else it.f=1;
    if(fit(it.x,it.y,it.f)){placed.push(it);continue;}
    let done=false;
    for(let y=off;y<=off+sz-it.f&&!done;y++)for(let x=off;x<=off+sz-it.f&&!done;x++)
      if(fit(x,y,it.f)){it.x=x;it.y=y;placed.push(it);done=true;}
    if(!done&&it.kind==='exhibit'){s.inv=s.inv||[];for(let c=0;c<(it.count||1);c++)s.inv.push({sp:it.sp});}
  }
  s.items=placed;s.trash=[];s.v=2;
}

function decoBoost(){
  let b=0;
  for(const it of state.items)if(it.kind==='deco')b+=(DECOS[it.sp].boost||0);
  return Math.min(b,DECO_CAP)/100;
}
const MULT=[0,1,2.5,3.5,5]; // payout multiplier by animal count (matches the help text: x2.5 pair, x5 full)
const unlocked=lv=>state.lv>=(lv||1);
function storeCount(k){return state.items.filter(i=>i.kind==='store'&&i.sp===k).length;}

/* ---- XP & levels ---- */
let pendingLevelUps=[];
function gainXp(n,e){
  n=Math.max(0,Math.round(n));if(!n)return;
  state.xp+=n;
  if(e)setTimeout(()=>flyText('<span style="color:#c9f7b0">+'+n+' XP</span>',e.clientX+18,e.clientY+14),120);
  while(state.xp>=xpNeed(state.lv)){
    state.xp-=xpNeed(state.lv);state.lv++;
    const g=levelGold(state.lv);
    state.gold+=g;state.stars+=1;
    pendingLevelUps.push(state.lv);
  }
  save();updateHUD();
  if(pendingLevelUps.length&&!$('#dlgWrap').classList.contains('open'))setTimeout(showLevelUp,450);
}
function cycleMs(it){
  if(it.kind==='exhibit')return SP[it.sp].per*60000;
  if(it.kind==='store')return STORES[it.sp].per*60000;
  return 0;
}
function payout(it){
  if(it.kind==='exhibit')return Math.max(1,Math.round(SP[it.sp].pay*MULT[clamp(it.count,1,4)]*(1+decoBoost())));
  if(it.kind==='store')return Math.max(1,Math.round(STORES[it.sp].pay*(1+decoBoost())));
  return 0;
}
function ready(it){return (it.kind==='exhibit'||it.kind==='store')&&nowMs()>=it.next;}
function readyCount(){return state.items.filter(ready).length;}
function totalPerMinRevenue(){
  let r=0;
  for(const it of state.items){
    if(it.kind!=='exhibit'&&it.kind!=='store')continue;
    const perMin=cycleMs(it)/60000;
    if(perMin>0)r+=payout(it)/perMin;
  }
  return r;
}
function speciesOwned(){
  const set=new Set();for(const it of state.items)if(it.kind==='exhibit')set.add(it.sp);
  for(const v of state.inv)set.add(v.sp);
  for(const b of state.hatch.breeds)if(b.res)set.add(b.res);
  return set;
}
function ownsSp(k){for(const it of state.items)if(it.kind==='exhibit'&&it.sp===k)return true;return false;}

/* ================= iso world ================= */
const TW=128,TH=64;
const ZOOM_MIN=0.2,ZOOM_MAX=2.4;
let pan={x:0,y:0,s:1};
function gridOff(){const sz=EXP_SIZES[state.exp];return GRID_MAX-sz;}
function isEntranceTile(x,y){return x===GRID_MAX-1&&y===GRID_MAX-1;}
function inGrid(x,y){const o=gridOff(),sz=EXP_SIZES[state.exp];return x>=o&&y>=o&&x<o+sz&&y<o+sz;}
function isoPt(x,y){return {x:(x-y)*TW/2, y:(x+y)*TH/2};}
function footOf(it){return it.f||1;}
function covers(it,x,y){const f=footOf(it);return x>=it.x&&y>=it.y&&x<it.x+f&&y<it.y+f;}
function itemAtTile(x,y){return state.items.find(i=>covers(i,x,y));}
function trashAt(x,y){return state.trash.find(t=>t.x===x&&t.y===y);}
function canPlaceAt(x,y,f,ignoreId){
  for(let dx=0;dx<f;dx++)for(let dy=0;dy<f;dy++){
    const tx=x+dx,ty=y+dy;
    if(!inGrid(tx,ty))return false;
    if(isEntranceTile(tx,ty))return false;
    if(state.items.some(i=>i.id!==ignoreId&&covers(i,tx,ty)))return false;
    if(trashAt(tx,ty))return false;
  }
  return true;
}
function emptyTiles(){
  const o=gridOff(),sz=EXP_SIZES[state.exp],out=[];
  for(let x=o;x<o+sz;x++)for(let y=o;y<o+sz;y++)
    if(!itemAtTile(x,y)&&!trashAt(x,y)&&!isEntranceTile(x,y))out.push([x,y]);
  return out;
}

function fenceFor(it){

/* ================= input: pan / pinch / tap / drag ================= */
(function(){
  const svg=$('#worldSvg');
  const pts=new Map();let start=null,moved=false,pinch0=0,s0=1;
  let dragItem=null,panDirty=false;
  function requestPanUpdate(){panDirty=true;}
  (function panLoop(){if(panDirty){applyPan();panDirty=false;}requestAnimationFrame(panLoop);})();
  function resetBaseline(){
    if(pts.size===1){
      const p=[...pts.values()][0];
      start={x:p.x,y:p.y,px:pan.x,py:pan.y};
    } else if(pts.size===2){
      const a=[...pts.values()];
      pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      s0=pan.s;
    }
  }
  svg.addEventListener('pointerdown',e=>{
    e.preventDefault();
    svg.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){
      moved=false;
      if(mode.type==='move'){
        const g2=screenToGrid(e);
        const it=itemAtTile(g2.x,g2.y);
        if(it){
          dragItem=it.id;
          mode.payload={moving:it.id,kind:it.kind,sp:it.sp,f:footOf(it)};
          mode.at={x:it.x,y:it.y};
          renderWorld();updateConfirmBar();
        }
      }
    }
    resetBaseline();
    svg.classList.add('dragging');
  });
  svg.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    e.preventDefault();
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(dragItem){
      const g2=screenToGrid(e);
      const half=Math.floor((mode.payload.f-1)/2);
      mode.at={x:g2.x-half,y:g2.y-half};
      moved=true;
      renderWorld();
      return;
    }
    if(pts.size===1&&start){
      const dx=e.clientX-start.x,dy=e.clientY-start.y;
      if(Math.abs(dx)+Math.abs(dy)>10)moved=true;
      if(moved){pan.x=start.px+dx;pan.y=start.py+dy;requestPanUpdate();}
    } else if(pts.size===2){
      const a=[...pts.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinch0>0){const ns=clamp(s0*d/pinch0,ZOOM_MIN,ZOOM_MAX);
        const cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2;
        pan.x=cx-(cx-pan.x)*ns/pan.s;pan.y=cy-(cy-pan.y)*ns/pan.s;pan.s=ns;requestPanUpdate();}
      moved=true;
    }
  });
  function up(e){
    pts.delete(e.pointerId);
    if(pts.size>0){
      // a finger lifted but others remain (e.g. pinch collapsing to a single-finger pan),
      // re-anchor instead of ending the gesture, so the remaining pointer doesn't jump
      if(!dragItem)resetBaseline();
      return;
    }
    svg.classList.remove('dragging');
    if(dragItem){
      if(ghostValid()){
        const it=state.items.find(i=>i.id===dragItem);
        if(it){it.x=mode.at.x;it.y=mode.at.y;save();if(moved)toast('Moved!');}
      } else if(moved){
        toast("Can't place it there");
      }
      dragItem=null;mode.payload=null;mode.at=null;
      updateConfirmBar();renderWorld();updateHUD();
    } else if(!moved&&start){
      handleTap(e);
    }
    start=null;
  }
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  $('#zin').onclick=()=>{pan.s=clamp(pan.s*1.25,ZOOM_MIN,ZOOM_MAX);applyPan();};
  $('#zout').onclick=()=>{pan.s=clamp(pan.s/1.25,ZOOM_MIN,ZOOM_MAX);applyPan();};
})();
function screenToGrid(e){
  const r=$('#worldSvg').getBoundingClientRect();

}
function screenToWorldPt(e){

function handleTap(e){

  if(mode.type==='move')return; // dragging is handled directly in pointerdown/up
  const g2=screenToGrid(e);
  const it=itemAtTile(g2.x,g2.y);
  if(it)openItemSheet(it);
}
function beginMove(it){
  setMode('move');
  toast('Move mode on \u2014 drag anything to reposition it');
}
$('#okBtn').onclick=()=>{
  if(!ghostActive()||!ghostValid())return;
  if(mode.type==='place')placePending();
};
$('#noBtn').onclick=()=>cancelGhost(false);

/* ================= actions ================= */
function gainGold(n,e){
  state.gold+=n;state.stats.gold+=n;save();
  if(e){flyText('+'+fmt(n)+' '+coinIco,e.clientX,e.clientY);coinBurst(e.clientX,e.clientY,n);}
  else updateHUD();
  sfx('coin');
}
function coinBurst(x,y,n){
  const target=$('#chipGold').getBoundingClientRect();
  const tx=target.left+16,ty=target.top+target.height/2;
  const k=clamp(Math.round(Math.log10(Math.max(10,n))),2,6);
  let landed=0;
  for(let i=0;i<k;i++){
    const d=document.createElement('div');d.className='coinFly';d.innerHTML=coinIcoBig;
    const sx=x-10+(Math.random()*36-18),sy=y-10+(Math.random()*24-12);
    d.style.transform=`translate(${sx}px,${sy}px) scale(.6)`;
    document.body.appendChild(d);
    setTimeout(()=>{d.style.transform=`translate(${tx-10}px,${ty-10}px) scale(.9)`;},30+i*70);
    setTimeout(()=>{d.remove();if(++landed===1){updateHUD();pulseChip('#chipGold');}},780+i*70);
  }
}
function pulseChip(sel){const c=$(sel);c.classList.remove('pulse');void c.offsetWidth;c.classList.add('pulse');}
function collectItem(id,e){
  const it=state.items.find(i=>i.id===id);if(!it||!ready(it))return;
  const amt=payout(it);
  it.next=nowMs()+cycleMs(it);
  state.stats.collects=(state.stats.collects||0)+1;
  gainGold(amt,e);
  gainXp(xpFor(it),e);
  renderWorld();
}
function collectFromSheet(it){
  if(!ready(it)){toast('The coin is still on its way');return;}
  const amt=payout(it);
  it.next=nowMs()+cycleMs(it);
  state.stats.collects=(state.stats.collects||0)+1;
  gainGold(amt,null);
  gainXp(xpFor(it),null);
  toast('+'+fmt(amt)+' gold · +'+xpFor(it)+' XP');
  renderWorld();closeModal();
}
function pickTrash(id,e){
  const i=state.trash.findIndex(t=>t.id===id);if(i<0)return;
  state.trash.splice(i,1);
  state.stats.trash++;
  const revPerMin=totalPerMinRevenue();
  const amt=Math.max(30,Math.round(revPerMin*(1+Math.random()*2))); // ~1-3 minutes' worth of current income
  sfx('trash');
  gainGold(amt,e);
  gainXp(1+Math.floor(state.lv/8),e);
  // a lucky find, now and then
  if(Math.random()<0.06){state.stars++;save();setTimeout(()=>{toast('⭐ You found a star in the trash!');pulseChip('#chipStar');updateHUD();},500);}
  renderWorld();updateBadges();
}
function needLevel(lv){toast('🔒 Unlocks at level '+lv);sfx('nope');}
function needGold(c){toast('Not enough gold — you need '+fmt(c-state.gold)+' more');sfx('nope');}
function needStars(c){toast('Not enough stars — earn them from missions & level-ups');sfx('nope');}
function placePending(){
  const p=mode.payload,x=mode.at.x,y=mode.at.y;
  if(p.kind==='exhibit'){
    state.items.push({id:uid(),kind:'exhibit',sp:p.sp,count:1,x,y,f:p.f,next:nowMs()+SP[p.sp].per*60000});
    discover(p.sp);
    if(p.fromInv!==undefined)state.inv.splice(p.fromInv,1);
    toast(SP[p.sp].n+' placed!');
  } else if(p.kind==='store'){
    state.items.push({id:uid(),kind:'store',sp:p.sp,x,y,f:p.f,next:nowMs()+STORES[p.sp].per*60000});
    toast(STORES[p.sp].n+' opened!');
  } else if(p.kind==='deco'){
    state.items.push({id:uid(),kind:'deco',sp:p.sp,x,y,f:1});
    toast(DECOS[p.sp].n+' placed!');
  }
  save();sfx('place');
  if(p.paid&&p.kind!=='deco')gainXp(buyXp(p.paid),null);
  if(p.kind==='deco'&&!p.paidStars)gainXp(Math.max(1,Math.round(p.paid/500)),null);
  if(p.kind==='exhibit'&&state.inv.length>0){
    const nx=state.inv[0];
    setMode('place',{kind:'exhibit',sp:nx.sp,f:SP[nx.sp].f,fromInv:0});
    toast('Next: tap a spot for your '+SP[nx.sp].n);
  } else setMode('normal');
  updateHUD();updateBadges();
}
function discover(sp){
  if(!state.disc.includes(sp)){state.disc.push(sp);
    const t=SP[sp].tier;
    if(t==='hybrid'){toast('✨ New hybrid discovered: '+SP[sp].n+'!');sfx('fanfare');}
    if(t==='myth'){toast('🌟 Mythical discovered: '+SP[sp].n+'!');sfx('fanfare');}
    if(t==='cap'&&!state.won){state.won=true;setTimeout(showWin,900);}
    // newly possible crossbreeds get announced
    for(const r of RECIPES)if((r.a===sp||r.b===sp)&&state.disc.includes(r.a)&&state.disc.includes(r.b)&&!state.disc.includes(r.res))
      setTimeout(()=>toast('🥚 New crossbreed recipe revealed in the Hatchery!'),1400);
    save();}
}
function hasSpaceFor(f){
  const o=gridOff(),sz=EXP_SIZES[state.exp];
  for(let x=o;x<=o+sz-f;x++)for(let y=o;y<=o+sz-f;y++)if(canPlaceAt(x,y,f,null))return true;
  return false;
}
function noSpace(f){toast('No room for a '+f+'×'+f+' plot — expand the island or move things around');sfx('nope');}
function buySpecies(k){
  const sp=SP[k];
  if(!unlocked(sp.lv))return needLevel(sp.lv);
  if(state.gold<sp.cost)return needGold(sp.cost);
  if(!hasSpaceFor(sp.f))return noSpace(sp.f);
  state.gold-=sp.cost;save();updateHUD();sfx('buy');
  closeModal();
  setMode('place',{kind:'exhibit',sp:k,f:sp.f,paid:sp.cost});
  toast('Tap a spot for the '+sp.n+"'s "+sp.f+'×'+sp.f+' habitat, then ✓');
}
function buySecond(it){
  const sp=SP[it.sp];
  if(!sp.cost){toast('This species can only be bred');return;}
  if(state.gold<sp.cost)return needGold(sp.cost);
  state.gold-=sp.cost;it.count=2;save();sfx('fanfare');
  toast('A second '+sp.n+' arrives — payouts ×2.5!');
  gainXp(buyXp(sp.cost),null);
  updateHUD();renderWorld();closeModal();
}
function buyStore(k){
  const st=STORES[k];
  if(!unlocked(st.lv))return needLevel(st.lv);
  if(storeCount(k)>=st.max){toast('Your island already has '+st.max+' of these');sfx('nope');return;}
  if(state.gold<st.cost)return needGold(st.cost);
  if(!hasSpaceFor(st.f))return noSpace(st.f);
  state.gold-=st.cost;save();updateHUD();closeModal();sfx('buy');
  setMode('place',{kind:'store',sp:k,f:st.f,paid:st.cost});
  toast('Tap a spot for the '+st.n+', then ✓');
}
function buyDeco(k){
  const d=DECOS[k];
  if(!unlocked(d.lv))return needLevel(d.lv);
  if(!hasSpaceFor(1))return noSpace(1);
  let paid=0,paidStars=0;
  if(d.star){if(state.stars<d.cost)return needStars(d.cost);state.stars-=d.cost;paidStars=d.cost;}
  else{if(state.gold<d.cost)return needGold(d.cost);state.gold-=d.cost;paid=d.cost;}
  save();updateHUD();closeModal();sfx('buy');
  setMode('place',{kind:'deco',sp:k,f:1,paid:paid,paidStars:paidStars});
  toast('Tap a spot for the '+d.n+', then ✓');
}
function sellValue(it){
  if(it.kind==='exhibit'){const sp=SP[it.sp];
    // bred species are priceless to the player but must not be a gold exploit: refund half a payout per animal
    return Math.floor(sp.cost?sp.cost*Math.min(it.count,2)*0.5:sp.pay*it.count*0.5);}
  if(it.kind==='store')return Math.floor(STORES[it.sp].cost*0.5);
  if(it.kind==='deco'&&!DECOS[it.sp].star)return Math.floor(DECOS[it.sp].cost*0.5);
  return 0;
}
function sellItem(it){
  const refund=sellValue(it);
  state.items=state.items.filter(i=>i.id!==it.id);
  if(refund>0){state.gold+=refund;}
  save();updateHUD();renderWorld();closeModal();sfx('trash');
  toast(refund>0?('Sold for '+fmt(refund)+' gold'):'Removed');
}
function buyExpansion(){
  if(state.exp>=EXP_SIZES.length-1){toast('The island is fully grown!');return;}
  const lv=EXP_LV[state.exp+1];
  if(!unlocked(lv))return needLevel(lv);
  const cost=EXP_COST[state.exp+1];
  if(state.gold<cost)return needGold(cost);
  state.gold-=cost;state.exp++;save();sfx('fanfare');
  toast('🏝️ The island grows!');
  gainXp(buyXp(cost),null);
  updateHUD();renderWorld();centerView();closeModal();confetti(40);
}
function buySlot(){
  const n=state.hatch.slots;
  if(n>=3){toast('All hatchery slots built');return;}
  if(!unlocked(SLOT_LV[n]))return needLevel(SLOT_LV[n]);
  const cost=SLOT_COST[n];
  if(state.gold<cost)return needGold(cost);
  state.gold-=cost;state.hatch.slots++;save();updateHUD();sfx('buy');
  gainXp(buyXp(cost),null);
  openHatch(0);
  toast('New hatchery nest built!');
}

/* ---- breeding ---- */
function pendingFor(itemId){return state.hatch.breeds.filter(b=>b.type==='same'&&b.exhibit===itemId).length;}
function startSameBreed(itemId){
  if(state.hatch.breeds.length>=state.hatch.slots){toast('No free hatchery nests');sfx('nope');return;}
  const it=state.items.find(i=>i.id===itemId);
  if(!it||it.count<2||it.count+pendingFor(itemId)>=4){toast('Needs a pair with room to grow');sfx('nope');return;}
  const mins=SP[it.sp].breed;
  state.hatch.breeds.push({id:uid(),type:'same',res:it.sp,exhibit:it.id,end:nowMs()+mins*60000,total:mins*60000});
  state.stats.breeds++;save();updateBadges();openHatch(0);sfx('buy');
  toast('Breeding started: '+SP[it.sp].n);
}
function startCross(recipe){
  if(state.hatch.breeds.length>=state.hatch.slots){toast('No free hatchery nests');sfx('nope');return;}
  if(!ownsSp(recipe.a)||!ownsSp(recipe.b)){toast('You need both parent species in your zoo');sfx('nope');return;}
  if(!unlocked(SP[recipe.res].lv))return needLevel(SP[recipe.res].lv);
  const mins=SP[recipe.res].breed;
  state.hatch.breeds.push({id:uid(),type:'cross',res:recipe.res,end:nowMs()+mins*60000,total:mins*60000});
  state.stats.breeds++;save();updateBadges();openHatch(0);sfx('buy');
  toast('The egg is warming…');
}
function hatchReady(b){return nowMs()>=b.end;}
function collectBreed(bid){
  const i=state.hatch.breeds.findIndex(b=>b.id===bid);if(i<0)return;
  const b=state.hatch.breeds[i];
  if(!hatchReady(b)){toast('Still incubating');return;}
  state.hatch.breeds.splice(i,1);
  sfx('hatch');
  gainXp(SP[b.res].breed/10,null);
  if(b.type==='same'){
    const it=state.items.find(x=>x.id===b.exhibit);
    if(it&&it.count<4){it.count++;toast('A baby '+SP[b.res].n+' joins the exhibit!');if(it.count===4)confetti(30);}
    else{state.inv.push({sp:b.res});toast('New '+SP[b.res].n+' sent to your inventory');}
  } else {
    const ex=state.items.find(x=>x.kind==='exhibit'&&x.sp===b.res&&x.count+pendingFor(x.id)<4);
    if(ex){ex.count++;discover(b.res);toast('The '+SP[b.res].n+' joins its exhibit!');}
    else{state.inv.push({sp:b.res});discover(b.res);
      closeModal();setMode('place',{kind:'exhibit',sp:b.res,f:SP[b.res].f,fromInv:state.inv.length-1});
      toast('Tap a spot for your new '+SP[b.res].n+'!');
      if(SP[b.res].tier!=='base')confetti(50);
      save();updateBadges();updateHUD();renderWorld();return;}
  }
  save();updateBadges();updateHUD();renderWorld();openHatch(0);
}
function speedUp(bid){
  const b=state.hatch.breeds.find(x=>x.id===bid);if(!b)return;
  const cost=rushCost(b.end-nowMs());
  if(state.stars<cost)return needStars(cost);
  state.stars-=cost;b.end=nowMs();
  save();updateHUD();openHatch(0);sfx('buy');
  toast('⭐ The egg wiggles… it\'s ready!');
}

/* ================= UI: modal framework ================= */
function openModal(title,tabs,onTab){
  $('#modalTitle').textContent=title;
  const tw=$('#modalTabs');
  if(tabs&&tabs.length){tw.style.display='flex';
    tw.innerHTML=tabs.map((t,i)=>`<button class="tab" data-i="${i}">${t}</button>`).join('');
    tw.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{selectTab(+b.getAttribute('data-i'));onTab(+b.getAttribute('data-i'));});
  } else {tw.style.display='none';tw.innerHTML='';}
  $('#modalWrap').classList.add('open');
}
function selectTab(i){$('#modalTabs').querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on',j===i));}
function closeModal(){$('#modalWrap').classList.remove('open');}
$('#modalClose').onclick=closeModal;
$('#modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal();});

function svgBox(sp,w,h){return `<svg viewBox="10 20 100 80" width="${w}" height="${h}">${spArt(sp)}</svg>`;}
function svgBoxRaw(artStr,w,h){return `<svg viewBox="10 20 100 80" width="${w}" height="${h}">${artStr}</svg>`;}
const coinIco='<svg width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9.2" fill="#d49a12"/><circle cx="10" cy="9.4" r="8.2" fill="#f7cf45"/><circle cx="10" cy="9.4" r="5.4" fill="none" stroke="#e0a91e" stroke-width="1.4"/><path d="M6 6.4 q 2 -2 4.6 -2" stroke="#fff6c8" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
const coinIcoBig=coinIco.replace('width="15" height="15"','width="20" height="20"');
const coinIcoS=coinIco.replace('width="15" height="15"','width="11" height="11"');
const STAR_D='M10 1.2 l2.6 5.6 6.2 .7 -4.6 4.2 1.3 6.1 -5.5 -3.1 -5.5 3.1 1.3 -6.1 -4.6 -4.2 6.2 -.7 z';
const starIco=`<svg width="15" height="15" viewBox="0 0 20 20"><path d="${STAR_D}" fill="#a77bf0" stroke="#6f45c0" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
// for purple buttons: a light star with a white rim so it never vanishes into the button colour
const starIcoL=`<svg width="15" height="15" viewBox="0 0 20 20"><path d="${STAR_D}" fill="#ffe27a" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
function fmtMin(m){return m<60?m+'m':(m%60?Math.floor(m/60)+'h '+(m%60)+'m':(m/60)+'h');}
function lockCard(artHtml,name,lv){
  return `<div class="card locked"><div class="aw silh">${artHtml}</div><div class="nm">${name}</div><div class="lockTag">🔒 Level ${lv}</div></div>`;
}
function newTag(key){if(state.seen[key])return '';state.seen[key]=1;save();return '<span class="newTag">NEW</span>';}
function priceBtn(attr,cost,label){
  const short=state.gold<cost;
  return `<button class="buyBtn${short?' short':''}" ${attr}>${label||''}${coinIco} ${fmt(cost)}</button>`;
}

/* ================= shop ================= */
let shopTab=0;
function openShop(tab){
  shopTab=tab===undefined?shopTab:tab;
  openModal('Shop',['🐾 Animals','🏪 Stores','🌳 Decor','🏝️ Expand','⭐ Star Shop'],i=>{shopTab=i;openShopTab(i);});
  selectTab(shopTab);openShopTab(shopTab);
}
function openShopTab(i){
  const b=$('#modalBody');
  if(i===0){
    let h='';
    for(const [tk,tn] of TIERS){
      const keys=Object.keys(SP).filter(k=>SP[k].tier===tk).sort((x,y)=>SP[x].lv-SP[y].lv);
      let cards='',lockedShown=0,lockedHidden=0;
      for(const k of keys){
        const sp=SP[k];
        if(!unlocked(sp.lv)){
          if(lockedShown<2){cards+=lockCard(svgBox(k,80,66),sp.n,sp.lv);lockedShown++;}else lockedHidden++;
          continue;
        }
        const owned=state.items.find(it=>it.kind==='exhibit'&&it.sp===k);
        let btn;
        if(!owned)btn=priceBtn(`data-buy="${k}"`,sp.cost);
        else if(owned.count===1)btn=priceBtn(`data-second="${owned.id}"`,sp.cost,'2nd ');
        else if(owned.count<4)btn=`<button class="buyBtn ghost" data-breedhint="${owned.id}">Breed for more 🥚</button>`;
        else btn=`<div class="meta" style="padding:6px 0">Family complete 🎉</div>`;
        cards+=`<div class="card">${owned?'':newTag('sp:'+k)}<div class="aw">${svgBox(k,80,66)}</div>
          <div class="nm">${sp.n}</div>
          <div class="meta">${coinIcoS} ${fmt(sp.pay)} / ${fmtMin(sp.per)} · ${sp.f}×${sp.f}</div>
          ${btn}</div>`;
      }
      if(!cards)continue;
      h+=`<div class="secH">${tn}</div><div class="grid2">${cards}</div>`;
      if(lockedHidden)h+=`<div class="hint">+${lockedHidden} more at higher levels</div>`;
    }
    h+=`<div class="hint">Hybrids & mythical creatures can't be bought — discover them by crossbreeding in the Hatchery 🥚</div>`;
    b.innerHTML=h;
    b.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>buySpecies(x.getAttribute('data-buy')));
    b.querySelectorAll('[data-second]').forEach(x=>x.onclick=()=>{const it=state.items.find(i=>i.id===x.getAttribute('data-second'));if(it)buySecond(it);});
    b.querySelectorAll('[data-breedhint]').forEach(x=>x.onclick=()=>{closeModal();openHatch(1);});
  }
  if(i===1){
    let h='<div class="hint">Stores earn gold from your visitors, no animals needed.</div><div class="grid2">';
    for(const k of Object.keys(STORES)){const st=STORES[k];
      if(!unlocked(st.lv)){h+=lockCard(svgBoxRaw(st.art(),80,66),st.n,st.lv);continue;}
      const n=storeCount(k);
      h+=`<div class="card">${newTag('st:'+k)}<div class="aw">${svgBoxRaw(st.art(),80,66)}</div>
        <div class="nm">${st.n}</div><div class="meta">${coinIcoS} ${fmt(st.pay)} / ${fmtMin(st.per)} · ${n}/${st.max} built</div>
        ${n>=st.max?'<div class="meta" style="padding:6px 0">Max built ✔</div>':priceBtn(`data-buy="${k}"`,st.cost)}</div>`;}
    h+='</div>';
    b.innerHTML=h;
    b.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>buyStore(x.getAttribute('data-buy')));
  }
  if(i===2){
    const cur=Math.round(decoBoost()*100);
    let h=`<div class="hint">Decorations boost every coin payout (now +${cur}%, max +${DECO_CAP}%). Paths don’t boost payouts, but visitors love walking on them.</div><div class="grid2">`;
    for(const k of Object.keys(DECOS)){const d=DECOS[k];if(d.star)continue;
      if(!unlocked(d.lv)){h+=lockCard(svgBoxRaw(d.art(),80,66),d.n,d.lv);continue;}
      const meta=d.path?'Visitors walk here more 🚶':`+${d.boost}% payouts`;
      h+=`<div class="card">${(d.lv||1)>1?newTag('dc:'+k):''}<div class="aw">${svgBoxRaw(d.art(),80,66)}</div>
        <div class="nm">${d.n}</div><div class="meta">${meta}</div>
        ${priceBtn(`data-buy="${k}"`,d.cost)}</div>`;}
    h+='</div>';
    b.innerHTML=h;
    b.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>buyDeco(x.getAttribute('data-buy')));
  }
  if(i===3){
    const maxed=state.exp>=EXP_SIZES.length-1;
    const cur=EXP_SIZES[state.exp];
    let h=`<div class="card" style="margin:6px auto;max-width:300px">
      <div style="font-size:40px">🏝️</div>
      <div class="nm">Island size: ${cur} × ${cur}</div>`;
    if(maxed)h+=`<div class="meta">Your island is fully grown!</div>`;
    else{
      const nx=state.exp+1;
      h+=`<div class="meta">Grow to ${EXP_SIZES[nx]} × ${EXP_SIZES[nx]} (+${EXP_SIZES[nx]**2-cur*cur} tiles)</div>`;
      h+=unlocked(EXP_LV[nx])?priceBtn('id="expBtn"',EXP_COST[nx]):`<div class="lockTag">🔒 Level ${EXP_LV[nx]}</div>`;
    }
    h+='</div>';
    b.innerHTML=h;
    const eb=$('#expBtn');if(eb)eb.onclick=buyExpansion;
  }
  if(i===4){
    let h=`<div class="hint">Stars come from missions, level-ups and the odd lucky find in the trash. Spend them on premium decor, or to rush hatchery eggs.</div><div class="grid2">`;
    for(const k of Object.keys(DECOS)){const d=DECOS[k];if(!d.star)continue;
      const short=state.stars<d.cost;
      h+=`<div class="card"><div class="aw">${svgBoxRaw(d.art(),80,66)}</div>
        <div class="nm">${d.n}</div><div class="meta">+${d.boost}% payouts</div>
        <button class="buyBtn star${short?' short':''}" data-buy="${k}">${starIcoL} ${d.cost}</button></div>`;}
    h+='</div>';
    b.innerHTML=h;
    b.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>buyDeco(x.getAttribute('data-buy')));
  }
}

/* ================= hatchery ================= */

}
// a recipe is revealed once the player has acquired (ever placed) both parent species
const recipeKnown=r=>state.disc.includes(r.a)&&state.disc.includes(r.b);
function nestBusy(res){return state.hatch.breeds.some(b=>b.type==='cross'&&b.res===res);}
function openHatchTab(i){
  const b=$('#modalBody');
  if(i===0){
    let h='';
    for(let s2=0;s2<3;s2++){

// keeps hatchery timers ticking while the panel is open, without rebuilding the buttons
function updateLiveModal(){
  if(!$('#modalWrap').classList.contains('open'))return;
  let needRebuild=false;
  for(const br of state.hatch.breeds){
    const bar=document.querySelector(`[data-live-bar="${br.id}"]`);if(!bar)continue;
    const rem=br.end-nowMs();
    bar.style.width=clamp(100*(1-rem/br.total),0,100)+'%';
    const t=document.querySelector(`[data-live-txt="${br.id}"]`);
    if(rem<=0){if(document.querySelector(`[data-speed="${br.id}"]`))needRebuild=true;}
    else if(t)t.textContent=fmtTime(rem)+' left';
  }
  if(needRebuild)openHatchTab(0);
}

function openMissions(){
  openModal('Missions',null,null);
  const b=$('#modalBody');
  let h='';
  const nDone=MISSIONS.filter(m=>state.claimed[m.id]).length;
  h+=`<div class="hint">${nDone}/${MISSIONS.length} goals complete — new goals appear as you finish these.</div>`;
  const rew=m=>(m.g?`${coinIcoS} ${fmt(m.g)} `:'')+`${starIco} ${m.r}`;
  for(const m of visibleMissions()){
    const done=m.c(state);
    h+=`<div class="mis ${done?'done':''}"><div class="t">${m.t}</div>`;
    if(done)h+=`<button class="buyBtn star" data-claim="${m.id}">Claim ${starIcoL} ${m.r}${m.g?' '+coinIcoS+' '+fmt(m.g):''}</button>`;
    else h+=`<div class="meta" style="display:flex;align-items:center;gap:3px">${rew(m)}</div>`;
    h+='</div>';
  }
  if(nDone===MISSIONS.length)h+='<div class="hint" style="padding:20px">Every goal complete. You are a legendary zookeeper! 🏆</div>';

  b.querySelectorAll('[data-claim]').forEach(x=>x.onclick=e=>{

    }});
}

function confetti(n){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#f5c542','#e0574a','#4a90c9','#5cc46e','#a77bf0','#f28fb0'];
  for(let i=0;i<n;i++){
    const d=document.createElement('div');d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';d.style.background=cols[i%cols.length];
    d.style.setProperty('--dx',(Math.random()*160-80)+'px');d.style.setProperty('--rot',(Math.random()*900-450)+'deg');
    const dur=1.8+Math.random()*1.8;d.style.animationDuration=dur+'s';d.style.animationDelay=(Math.random()*0.4)+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),(dur+0.5)*1000);
  }
}

  $('#chipRate').innerHTML='<span style="font-size:13px">💰</span> <span id="hReady"></span><span class="sub"> ready</span>';
  $('#chipLv').onclick=()=>{
    const nx=[];for(let L=state.lv+1;L<=MAX_LV&&nx.length<1;L++)if(unlocksAt(L).length)nx.push(L);
    if(!nx.length){toast('Level '+state.lv+' — everything is unlocked!');return;}
    const u=unlocksAt(nx[0]).map(q=>q.kind==='animal'?(SP[q.k].cost?SP[q.k].n:'a secret crossbreed'):q.kind==='store'?STORES[q.k].n:q.kind==='deco'?DECOS[q.k].n:q.kind==='exp'?'island expansion':'a new nest');
    toast('Level '+nx[0]+' unlocks: '+u.join(', '));
  };
}
let hudGold=null;
function updateHUD(){
  const need=xpNeed(state.lv);
  $('#hLv').textContent=state.lv;
  $('#hXp').style.width=clamp(100*state.xp/need,0,100)+'%';

  $('#hStar').textContent=state.stars;

}
function updateBadges(){
  const ready=state.hatch.breeds.filter(hatchReady).length+state.inv.length;
  const bh=$('#bHatch');bh.style.display=ready?'flex':'none';bh.textContent=ready;
  const cm=claimableMissions();
  const bm=$('#bMis');bm.style.display=cm?'flex':'none';bm.textContent=cm;
}
function toast(msg){
  const box=$('#toasts');
  while(box.children.length>=3)box.firstChild.remove(); // never let toasts pile up over the island
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  box.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';},2600);
  setTimeout(()=>t.remove(),3000);
}
function flyText(html,x,y){
  const d=document.createElement('div');d.className='fly';d.innerHTML=html;
  d.style.left=(x-20)+'px';d.style.top=(y-24)+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),950);

/* ================= audio: music + sound effects =================
   One AudioContext, created and resumed from inside real user gestures (browsers keep it
   suspended otherwise, which is why music never started before: the old code created it on
   'pointerdown', which does not count as a user activation for touch input, and never retried).
   Music uses a look-ahead scheduler so nothing piles up while the context is suspended. */
let AC=null,musBus=null,sfxBus=null,noiseBuf=null;
function audioInit(){
  if(AC)return AC;
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;
  try{AC=new Ctx();}catch(e){return null;}
  const master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  const comp=AC.createDynamicsCompressor();comp.connect(master);
  musBus=AC.createGain();musBus.gain.value=0;musBus.connect(comp);
  sfxBus=AC.createGain();sfxBus.gain.value=0.7;sfxBus.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  AC.onstatechange=updateMusicBtn;
  return AC;
}
function audioUnlock(e){
  const ac=audioInit();if(!ac)return;
  if(ac.state!=='running')ac.resume().then(updateMusicBtn).catch(()=>{});
  if(!audioUnlock.done){audioUnlock.done=true;
    try{const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);}catch(err){}}
  // the music button handles itself, so its first tap doesn't start-then-stop the music
  if(state&&state.musicOn&&!musOn&&!(e&&e.target&&e.target.closest&&e.target.closest('#musicBtn,#setMus')))musStart();
}
['pointerdown','pointerup','touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,audioUnlock,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(!AC)return;
  if(document.hidden)AC.suspend().catch(()=>{});else AC.resume().catch(()=>{});
});
const NOTE_SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nf(n){const m=/^([A-G])(#?)(\d)$/.exec(n);return 440*Math.pow(2,((+m[3]+1)*12+NOTE_SEMI[m[1]]+(m[2]?1:0)-69)/12);}
function env(g,t,peak,att,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec);}
function tone(bus,type,freq,t,peak,att,dec,freqEnd){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(freqEnd)o.frequency.exponentialRampToValueAtTime(freqEnd,t+att+dec);
  env(g,t,peak,att,dec);o.connect(g).connect(bus);o.start(t);o.stop(t+att+dec+0.05);
}
function marimba(bus,freq,t,v){tone(bus,'sine',freq,t,0.22*v,0.004,0.45);tone(bus,'sine',freq*4,t,0.05*v,0.002,0.08);}
function noise(bus,t,peak,dec,ftype,f0,f1){
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=ftype;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dec);
  const g=AC.createGain();env(g,t,peak,0.003,dec);
  s.connect(f).connect(g).connect(bus);s.start(t);s.stop(t+dec+0.05);
}
/* a breezy island tune: 8 bars of eighth notes over C G Am F | F C Dm G */
const MUS_BPM=100,MUS_STEP=60/MUS_BPM/2;
const MUS_BARS=[
 {b:'C3',f:'G3',ch:['C4','E4','G4'],m:['E5',null,'G5',null,'E5','D5','C5',null]},
 {b:'G2',f:'D3',ch:['B3','D4','G4'],m:['D5',null,'B4',null,'D5',null,'G4',null]},
 {b:'A2',f:'E3',ch:['C4','E4','A4'],m:['C5',null,'E5',null,'A5','G5','E5',null]},
 {b:'F2',f:'C3',ch:['C4','F4','A4'],m:['F5',null,'E5','D5','C5',null,null,null]},
 {b:'F2',f:'C3',ch:['C4','F4','A4'],m:['A4','C5','F5',null,'E5',null,'C5',null]},
 {b:'C3',f:'G3',ch:['C4','E4','G4'],m:['G4','C5','E5',null,'D5','C5',null,null]},
 {b:'D3',f:'A3',ch:['D4','F4','A4'],m:['D5','F5','A5',null,'G5','F5','E5','D5']},
 {b:'G2',f:'D3',ch:['B3','D4','G4'],m:['G5',null,null,'D5','B4',null,'G4',null]}
];
let musOn=false,musNext=0,musStepN=0,musTimer=null;
function musStart(){
  if(!audioInit())return;
  if(!musOn){musOn=true;musNext=AC.currentTime+0.12;musStepN=0;clearInterval(musTimer);musTimer=setInterval(musTick,50);}
  musBus.gain.cancelScheduledValues(AC.currentTime);musBus.gain.setTargetAtTime(0.5,AC.currentTime,0.4);
  updateMusicBtn();
}
function musStop(){
  musOn=false;clearInterval(musTimer);
  if(AC){musBus.gain.cancelScheduledValues(AC.currentTime);musBus.gain.setTargetAtTime(0,AC.currentTime,0.06);}
  updateMusicBtn();
}
function musTick(){
  if(!AC||AC.state!=='running')return;
  if(musNext<AC.currentTime-0.2)musNext=AC.currentTime+0.05; // woke from a throttled tab: skip ahead, never burst
  while(musNext<AC.currentTime+0.3){musPlayStep(musStepN,musNext);musNext+=MUS_STEP;musStepN++;}
}
function musPlayStep(n,t){
  const loop=Math.floor(n/64),bar=MUS_BARS[Math.floor(n/8)%8],st=n%8;
  const alt=loop%2===1;
  const m=bar.m[st];
  if(m){const f=nf(m)*(alt&&st%2===0?0.5:1);marimba(musBus,f,t,alt?0.8:1);}
  if(alt&&st===3)marimba(musBus,nf(bar.ch[2])*2,t,0.45);              // little echo on the second pass
  if(st===0)tone(musBus,'triangle',nf(bar.b),t,0.2,0.01,0.5);
  if(st===4)tone(musBus,'triangle',nf(bar.f),t,0.16,0.01,0.4);
  if(st===2||st===6)bar.ch.forEach(c=>tone(musBus,'sine',nf(c),t,0.035,0.01,0.25));
  if(st===0)bar.ch.forEach(c=>tone(musBus,'sine',nf(c)/2,t,0.025,0.25,1.4)); // soft pad
  noise(musBus,t,st%2?0.035:0.018,0.045,'highpass',7000);                  // shaker
}
function updateMusicBtn(){
  const b=$('#musicBtn');if(!b||!state)return;
  const playing=state.musicOn&&musOn&&AC&&AC.state==='running';
  b.classList.toggle('toggled',!playing);
  b.textContent=playing?'🎵':'🔇';
  b.title=playing?'Music on (tap to mute)':'Music off (tap to play)';
}
function toggleMusic(){
  audioUnlock();
  // tap means "make it play" when it isn't audibly playing, even if the saved setting says on
  if(state.musicOn&&musOn){state.musicOn=false;musStop();}
  else{state.musicOn=true;musStart();if(AC&&AC.state!=='running')AC.resume().then(updateMusicBtn).catch(()=>{});}
  save();updateMusicBtn();
}
function sfx(name){
  if(!state||!state.sfxOn||!AC||AC.state!=='running')return;
  const t=AC.currentTime+0.01,B=sfxBus;
  try{switch(name){
    case 'coin':tone(B,'sine',nf('B5'),t,0.16,0.003,0.09);tone(B,'sine',nf('E6'),t+0.07,0.16,0.003,0.22);tone(B,'triangle',nf('E7'),t+0.07,0.03,0.002,0.12);break;
    case 'click':tone(B,'sine',1800,t,0.05,0.002,0.03,1200);break;
    case 'buy':tone(B,'triangle',nf('G5'),t,0.12,0.004,0.08);tone(B,'triangle',nf('C6'),t+0.06,0.12,0.004,0.16);break;
    case 'place':tone(B,'sine',190,t,0.3,0.005,0.16,80);noise(B,t,0.08,0.08,'lowpass',900);marimba(B,nf('G5'),t+0.08,0.5);break;
    case 'trash':noise(B,t,0.12,0.16,'bandpass',2600,500);tone(B,'sine',nf('A5'),t+0.08,0.08,0.003,0.12);break;
    case 'nope':tone(B,'square',220,t,0.04,0.005,0.12,170);break;
    case 'hatch':['C5','E5','G5','C6'].forEach((n,i)=>marimba(B,nf(n),t+i*0.08,0.9));noise(B,t,0.05,0.06,'highpass',3000);break;
    case 'fanfare':['G4','C5','E5','G5'].forEach((n,i)=>tone(B,'triangle',nf(n),t+i*0.09,0.12,0.005,0.25));['C5','E5','G5'].forEach(n=>tone(B,'triangle',nf(n),t+0.4,0.07,0.01,0.6));break;
    case 'levelup':['C5','E5','G5','C6','E6','G6'].forEach((n,i)=>marimba(B,nf(n),t+i*0.07,1));['C5','E5','G5','C6'].forEach(n=>tone(B,'triangle',nf(n),t+0.45,0.06,0.02,0.9));break;
  }}catch(e){}
}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button'))sfx('click');});


/* ================= visitors ================= */
const visitors=[];
const SHIRT=['#d9432f','#3a7bd9','#3f9e5f','#e0912e','#9a6bde','#d96aa8'];
function visitorSVG(v){
  return `<g id="vis-${v.id}">
    ${E(0,2,5,2,'rgba(0,0,0,.2)')}
    ${R(-3.5,-14,3,10,1.4,'#4a4a5a')}${R(0.5,-14,3,10,1.4,'#4a4a5a')}
    ${R(-4.5,-26,9,13,4,v.shirt)}
    ${C(0,-30,4.4,v.skinc)}
    ${P(`M-4.4 -31 a 4.4 4.4 0 0 1 8.8 0 z`,v.hairc)}
  </g>`;
}
function totalAnimalCount(){
  let n=0;for(const it of state.items)if(it.kind==='exhibit')n+=it.count;
  return n;
}
function isPathTile(x,y){
  const it=itemAtTile(x,y);
  return !!(it&&it.kind==='deco'&&DECOS[it.sp]&&DECOS[it.sp].path);
}
function blockerAt(x,y){
  const it=itemAtTile(x,y);
  if(it&&it.kind==='deco'&&DECOS[it.sp]&&DECOS[it.sp].path)return null; // paths don't block, they invite
  return it;
}
function walkableAt(x,y){return inGrid(x,y)&&!blockerAt(x,y)&&!trashAt(x,y);}
function neighborsOf(cx,cy){
  const cand=[[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]].filter(([x,y])=>walkableAt(x,y));
  const weighted=[];
  for(const c of cand){weighted.push(c);if(isPathTile(c[0],c[1]))weighted.push(c,c,c);}
  return weighted.length?weighted:cand;
}
function anyWalkableTile(){
  const o=gridOff(),sz=EXP_SIZES[state.exp];
  for(let x=o;x<o+sz;x++)for(let y=o;y<o+sz;y++)if(walkableAt(x,y))return [x,y];
  return null;
}
function newVisitorAt(t){
  return {id:uid(),cx:t[0],cy:t[1],x:t[0]+0.5,y:t[1]+0.5,tx:t[0]+0.5,ty:t[1]+0.5,wait:Math.random()*2,
    shirt:SHIRT[Math.floor(Math.random()*SHIRT.length)],
    skinc:['#e8b990','#c98d5e','#8a5a3a','#f2d1ae'][Math.floor(Math.random()*4)],
    hairc:['#3a2a1e','#6e4a2a','#1e1e24','#a8742e'][Math.floor(Math.random()*4)]};
}
function syncVisitors(){
  const want=clamp(3+Math.round(totalAnimalCount()*0.6),3,26);
  while(visitors.length<want){
    const tiles=emptyTiles();
    const t=tiles.length?tiles[Math.floor(Math.random()*tiles.length)]:(anyWalkableTile()||[gridOff(),gridOff()]);
    visitors.push(newVisitorAt(t));
  }
  while(visitors.length>want)visitors.pop();
  $('#gVis').innerHTML=visitors.map(visitorSVG).join('');
}
let lastVis=0;
function visitorFrame(ts){
  const dt=Math.min(0.1,(ts-lastVis)/1000);lastVis=ts;
  for(const v of visitors){
    // if the tile we're standing/heading to became occupied (e.g. something was just placed), reroute immediately
    if(!walkableAt(Math.round(v.tx-0.5),Math.round(v.ty-0.5))){
      const nb=neighborsOf(v.cx,v.cy);
      if(nb.length){const n=nb[Math.floor(Math.random()*nb.length)];v.tx=n[0]+0.5;v.ty=n[1]+0.5;}
      else{v.tx=v.cx+0.5;v.ty=v.cy+0.5;}
    }
    const dx=v.tx-v.x,dy=v.ty-v.y,dist=Math.hypot(dx,dy);
    if(dist<0.05){
      v.x=v.tx;v.y=v.ty;v.cx=Math.round(v.tx-0.5);v.cy=Math.round(v.ty-0.5);
      v.wait-=dt;
      if(v.wait<=0){
        const nb=neighborsOf(v.cx,v.cy);
        if(nb.length){
          const n=nb[Math.floor(Math.random()*nb.length)];
          v.tx=n[0]+0.5;v.ty=n[1]+0.5;
        }
        v.wait=0.6+Math.random()*2.6;
      }
    } else {
      const sp2=Math.min(1,0.55*dt/dist);
      v.x+=dx*sp2;v.y+=dy*sp2;
    }
    const p=isoPt(v.x,v.y);
    const el=document.getElementById('vis-'+v.id);
    if(el)el.setAttribute('transform',`translate(${p.x} ${p.y}) scale(0.9)`);
  }
  requestAnimationFrame(visitorFrame);
}

/* ================= trash spawning ================= */
function maybeSpawnTrash(n){
  n=n||1;
  for(let i=0;i<n;i++){
    if(state.trash.length>=4)return;
    const tiles=emptyTiles();if(!tiles.length)return;
    const t=tiles[Math.floor(Math.random()*tiles.length)];
    state.trash.push({id:uid(),x:t[0],y:t[1]});
  }
  save();
}

/* ================= main loop ================= */
// The world is only re-rendered when something visible changes (a coin becomes ready, trash
// appears...). Re-rendering every second used to restart every CSS animation each tick.
let worldSig='';
function readySig(){return state.items.map(i=>ready(i)?1:0).join('')+'|'+state.trash.length;}
function tick(){
  updateHUD();updateBadges();updateLiveModal();
  const sig=readySig();
  if(sig!==worldSig&&!(mode.type==='move'&&mode.payload)){worldSig=sig;renderWorld();}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){dirty=true;doSave();}});

/* ================= nav wiring ================= */
$('#nShop').onclick=()=>{cancelGhost(true);openShop();};
$('#nHatch').onclick=()=>{cancelGhost(true);openHatch(0);};
$('#nMis').onclick=()=>{cancelGhost(true);openMissions();};
$('#nMove').onclick=()=>{
  if(mode.type==='move'||mode.type==='place'){cancelGhost(true);}
  else{setMode('move');toast('Move mode: drag anything to reposition it. Tap ✋ again to finish');}
};
$('#setBtn').onclick=openSettings;
$('#worldSvg').addEventListener('wheel',e=>{
  e.preventDefault();
  const ns=clamp(pan.s*Math.exp(-e.deltaY*0.0015),ZOOM_MIN,ZOOM_MAX);
  const r=$('#worldSvg').getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;
  pan.x=cx-(cx-pan.x)*ns/pan.s;pan.y=cy-(cy-pan.y)*ns/pan.s;pan.s=ns;applyPan();
},{passive:false});

/* ================= init ================= */
(async function init(){
  const had=await loadState();
  const away=nowMs()-(state.last||nowMs());
  buildHUD();updateHUD();placeToasts();
  centerView();
  renderWorld();updateHUD();updateBadges();updateMusicBtn();
  syncVisitors();requestAnimationFrame(visitorFrame);
  setInterval(syncVisitors,8000);
  setInterval(tick,1000);
  setInterval(()=>{if(Math.random()<0.5)maybeSpawnTrash(1);},60000);
  setInterval(doSave,15000);
  if(!had){
    openHelp();
    setMode('place',{kind:'exhibit',sp:'buffalo',f:SP.buffalo.f,fromInv:0});
    toast('Tap a spot for your Water Buffalo, then ✓');
  } else {
    if(away>5*60000){
      const rc=readyCount(),eggs=state.hatch.breeds.filter(hatchReady).length;
      let msg='Welcome back!';
      if(rc)msg+=' '+rc+' coin'+(rc>1?'s are':' is')+' waiting';
      if(eggs)msg+=(rc?' and ':' ')+eggs+' egg'+(eggs>1?'s are':' is')+' ready to hatch';
      toast(msg+(rc||eggs?' 🪙':''));
      maybeSpawnTrash(2);
    }
    if(state.won===false&&state.disc.includes('dragon'))state.won=true;
  }
})();
</script>
