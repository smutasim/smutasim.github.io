<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Long Ascent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kavoon&display=swap">
<style>
:root{
  /* Layout: a 2000s browser-game cabinet. Three bevelled panels on a starry tiled backdrop:
     the clicker (Earth) on the left, the record (research, frontier, story, fold) in the middle,
     the store on the right. Phones stack them. Chunky outlined display type, Verdana-era body text,
     gradient title bars and outset buttons. The accent hue walks from firelight to starlight by era. */
  color-scheme:dark;
  --bg:#0b1630; --bg2:#122247; --panel:#16264d; --panel2:#1d3263; --panel3:#24407a;
  --line:#05091a; --bevelHi:#5574b8; --bevelLo:#060c22;
  --text:#ffffff; --muted:#b9c7ea; --dim:#7f90bd; --good:#9cf28a; --bad:#ff8a7a;
  --acc:#ffb347; --accInk:#2a1400;
  --f-disp:'Kavoon','Comic Sans MS','Trebuchet MS',cursive;
  --f-body:Verdana,Tahoma,'DejaVu Sans',Geneva,sans-serif;
  --f-mono:Tahoma,Verdana,'DejaVu Sans',sans-serif;
  --outline:0 0 2px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,2px 2px 0 #000;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;color:var(--text);font:12px/1.4 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-color:var(--bg);
  background-image:
    radial-gradient(1px 1px at 20px 30px,#cfe0ff 50%,transparent 51%),
    radial-gradient(1px 1px at 90px 70px,#9fb8f0 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 140px 20px,#ffffff 50%,transparent 51%),
    radial-gradient(1px 1px at 60px 130px,#bcd0ff 50%,transparent 51%),
    radial-gradient(1px 1px at 170px 150px,#ffffff 50%,transparent 51%),
    linear-gradient(180deg,#0d1b3d,#07102a);
  background-size:190px 170px,190px 170px,190px 170px,190px 170px,190px 170px,100% 100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dotted var(--acc);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:8px;max-width:1500px;margin:0 auto;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* bevelled cabinet panels */
.box{background:linear-gradient(180deg,var(--panel2),var(--panel) 40px);border:3px solid;border-color:var(--bevelHi) var(--bevelLo) var(--bevelLo) var(--bevelHi);border-radius:4px;box-shadow:0 0 0 1px #000,inset 0 0 18px rgba(0,0,0,.45)}

/* counter */
#top{position:relative;display:grid;gap:3px;min-width:0;text-align:center;padding:8px 8px 6px;background:rgba(0,0,0,.35);border:2px solid #000;border-radius:4px}
.eraLine{display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap}
.eraLine b{font:400 15px var(--f-disp);color:var(--acc);text-shadow:var(--outline)}
.eraLine span{font:bold 11px var(--f-mono);color:var(--muted);text-shadow:1px 1px 0 #000}
#bank{font:400 clamp(24px,5vw,34px)/1.1 var(--f-disp);color:#fff;text-shadow:var(--outline),0 0 12px rgba(255,255,255,.25);font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
#bank small{display:block;font:400 15px var(--f-disp);color:var(--acc);margin-top:1px}
.popLine{font:10px var(--f-body);color:var(--dim);text-shadow:1px 1px 0 #000;letter-spacing:.02em}
.popLine b{font-weight:normal;color:var(--muted)}
.rateLine{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font:11px var(--f-mono);color:var(--muted);text-shadow:1px 1px 0 #000}
.rateLine b{color:#fff}
#buffs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.buff{font:bold 11px var(--f-mono);padding:2px 8px;border:2px outset #fff2b0;border-radius:3px;background:linear-gradient(#fff3a8,#e7a72c);color:#3a1d00}

.mute{position:absolute;top:6px;right:6px;display:flex;align-items:center;gap:4px;padding:3px 7px;background:linear-gradient(#3a5698,#1f3468);border:2px outset #5d7bc0;border-radius:3px;font:bold 10px var(--f-body);color:#fff;cursor:pointer;text-shadow:1px 1px 0 #000}
.mute:active{border-style:inset}
.mute svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mute[aria-pressed=true]{background:linear-gradient(#5a2a2a,#3a1515);border-color:#a85a5a}
/* globe */
#stage{position:relative;min-width:0}
#globeWrap{position:relative;width:100%;aspect-ratio:1/1;max-height:min(44vh,520px);margin:0 auto;max-width:100%}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:manipulation;outline:none}
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#clickLabel{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font:400 15px var(--f-disp);color:#fff;text-shadow:var(--outline);pointer-events:none;white-space:nowrap}
#anomaly{position:absolute;width:46px;height:46px;border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle,#fff 0,#fff6c8 18%,var(--acc) 42%,rgba(0,0,0,0) 70%);box-shadow:0 0 30px var(--acc);animation:pulse 1.2s ease-in-out infinite;z-index:3}
#anomaly::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px dashed rgba(255,255,255,.55);animation:spin 6s linear infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
#ticker{overflow:hidden;white-space:nowrap;background:#000;border:2px inset #2a3b66;padding:4px 0;font:11px var(--f-body);color:#9fe0ff;min-width:0}
#ticker span{display:inline-block;padding-left:100%;animation:tick 30s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* tabs, old-school */
#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:3px solid var(--bevelHi);padding:0 4px}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:7px 10px 5px;background:linear-gradient(#2c4a8c,#162a57);border:2px solid;border-color:var(--bevelHi) var(--bevelLo) transparent var(--bevelHi);border-bottom:0;border-radius:6px 6px 0 0;font:400 14px var(--f-disp);color:var(--muted);text-shadow:var(--outline);cursor:pointer;position:relative}
.tab[aria-selected=true]{background:linear-gradient(#4f78c9,#2c4a8c);color:#fff}
.tab i{position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--acc);border:1px solid #000}
#bottom{display:grid;grid-template-rows:auto minmax(0,1fr);gap:0;min-height:0;min-width:0}
.sec{min-height:0;overflow-y:auto;overscroll-behavior:contain;min-width:0;padding:8px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));background:rgba(8,15,38,.88);border:3px solid;border-top:0;border-color:transparent var(--bevelLo) var(--bevelLo) var(--bevelHi)}
h2.sh{font:400 22px/1.1 var(--f-disp);margin:2px 0 4px;color:#fff;text-shadow:var(--outline)}
p.sub{margin:0 0 10px;color:var(--muted);font-size:11.5px;max-width:65ch}
.lbl{font:400 15px var(--f-disp);color:#fff;text-shadow:var(--outline);margin:10px 0 6px;padding:3px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(90deg,#3b62b0,#1d3263 70%,transparent);border-radius:3px}
.lbl:first-child{margin-top:0}

/* store */
.buyAmt{display:flex;gap:3px}
.buyAmt button{background:linear-gradient(#3a5698,#1f3468);border:2px outset #5d7bc0;border-radius:3px;padding:1px 6px;font:bold 10px var(--f-mono);color:#cfdcff;cursor:pointer}
.buyAmt button[aria-pressed=true]{border-style:inset;background:linear-gradient(#1a2b55,#2c4583);color:#fff}
.gen{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;padding:5px 8px;cursor:pointer;margin-bottom:3px;
  background:linear-gradient(180deg,#8a5a32 0,#6b4122 50%,#5a3519 100%);border:2px solid;border-color:#b98352 #2b170a #2b170a #b98352;border-radius:3px;box-shadow:0 0 0 1px #000}
.gen:hover:not(:disabled){filter:brightness(1.12)}
.gen:active:not(:disabled){border-color:#2b170a #b98352 #b98352 #2b170a}
.gen.cant{filter:saturate(.35) brightness(.72)}
.gen.cant:hover{filter:saturate(.35) brightness(.8)}
.gen:disabled{cursor:default}
.gen.locked{filter:grayscale(1) brightness(.45)}
.gico{width:44px;height:44px;border-radius:4px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff3,#0003),#2a1708;border:2px inset #a8774a;color:var(--acc)}
.gico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(1px 1px 0 #000)}
.gn{font:400 17px/1.1 var(--f-disp);color:#fff;text-shadow:var(--outline);display:block;min-width:0}
.gc{font:bold 12px var(--f-mono);color:#9cf28a;text-shadow:1px 1px 0 #000}
.gen.cant .gc{color:#ff9a8a}
.gi{display:block;font:10.5px var(--f-body);color:#f1dcc4;text-shadow:1px 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gown{font:400 30px var(--f-disp);color:rgba(255,255,255,.35);text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.imp{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 7px;margin-bottom:3px;background:linear-gradient(#22396f,#152653);border:2px solid;border-color:var(--bevelHi) var(--bevelLo) var(--bevelLo) var(--bevelHi);border-radius:3px}
.imp .gico{width:32px;height:32px;border-radius:3px}
.imp .gico svg{width:18px;height:18px}
.imp b{font:400 14px var(--f-disp);display:block;color:#fff;text-shadow:var(--outline)}
.imp small{display:block;font:10.5px var(--f-body);color:var(--muted)}
.btn{background:linear-gradient(#ffd27a,#f0a032 55%,#c9761a);color:var(--accInk);border:2px outset #ffe1a0;border-radius:4px;padding:4px 10px;font:bold 11px var(--f-body);cursor:pointer;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn:active:not(:disabled){border-style:inset}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.btn.ghost{background:linear-gradient(#3a5698,#1f3468);color:#fff;border-color:#5d7bc0;text-shadow:1px 1px 0 #000}
.btn.big{padding:8px 16px;font-size:13px}
.more{background:none;border:0;color:#9fe0ff;font:bold 11px var(--f-body);cursor:pointer;padding:4px 2px;text-decoration:underline}

/* research tree, vertical */
.estrip{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:4px 0 8px}
.eseg{position:relative;height:30px;background:#050b1e;border:2px inset #2a3b66;border-radius:3px;cursor:pointer;padding:0;overflow:hidden}
.eseg i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#9cf28a,#3f8f35)}
.eseg span{position:relative;font:400 13px var(--f-disp);color:#fff;text-shadow:var(--outline)}
.eseg.cur{border:2px outset var(--acc)}
.tcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 9px;margin-bottom:4px;background:linear-gradient(#22396f,#152653);border:2px solid;border-color:var(--bevelHi) var(--bevelLo) var(--bevelLo) var(--bevelHi);border-radius:3px;scroll-margin:12px}
.tcard.own{background:linear-gradient(#2a4f27,#1a3318);border-color:#6fbf5e #0c1a0a #0c1a0a #6fbf5e}
.tcard.can{background:linear-gradient(#5a3d14,#3a260b);border-color:#ffd27a #1d1204 #1d1204 #ffd27a}
.tcard.lock{filter:saturate(.4) brightness(.7)}
.tcard.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px #fff,0 0 18px var(--acc)}100%{box-shadow:none}}
.tmain{min-width:0}
.thead{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.thead b{font:400 16px var(--f-disp);color:#fff;text-shadow:var(--outline)}
.tst{font:bold 12px var(--f-body);color:var(--acc);text-shadow:1px 1px 0 #000;width:12px}
.tcard.own .tst{color:#9cf28a}
.yr{font:bold 10.5px var(--f-mono);color:var(--acc);text-shadow:1px 1px 0 #000}
.tcard .fl{margin:3px 0 0;font:italic 11.5px/1.45 var(--f-body);color:#e6ecff;max-width:65ch}
.tcard .eff{margin:3px 0 0;font:bold 11px var(--f-body);color:#ffe2a8}
.tcard.own .eff{color:#c9f5bd}
.links{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:5px}
.links span{font:10px var(--f-body);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.tchip{font:bold 10.5px var(--f-body);padding:1px 6px;border-radius:3px;cursor:pointer;background:#0b1530;border:1px solid #3a5698;color:#cfdcff}
.tchip.own{border-color:#6fbf5e;color:#c9f5bd}
.tchip.can,.tchip.avail{border-color:var(--acc);color:#ffe2a8}
.tchip.lock{color:var(--dim)}
.tbuy{display:grid;justify-items:center;gap:3px}
.tbuy .btn{line-height:1.25;text-align:center}
.eta{font:10px var(--f-mono);color:var(--muted);white-space:nowrap}
details.era{margin-bottom:6px}
details.era>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:4px 10px;margin-bottom:4px;font:400 16px var(--f-disp);color:#fff;text-shadow:var(--outline);background:linear-gradient(#3b62b0,#1d3263);border:2px outset #5d7bc0;border-radius:3px}
details.era>summary::-webkit-details-marker{display:none}
details.era>summary::before{content:"\25B6";font-size:10px;margin-right:8px;color:#cfdcff}
details.era[open]>summary::before{content:"\25BC"}
details.era>summary span{flex:1}
details.era>summary small{font:bold 11px var(--f-body)}
/* frontier */
.fmap{border:2px inset #2a3b66;background:#050b1e;overflow:hidden}
.fmap svg{display:block;width:100%;max-height:300px}
.settle{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 9px;margin-bottom:3px;background:linear-gradient(#22396f,#152653);border:2px solid;border-color:var(--bevelHi) var(--bevelLo) var(--bevelLo) var(--bevelHi);border-radius:3px}
.settle b{font:400 16px var(--f-disp);color:#fff;text-shadow:var(--outline)}
.settle small{display:block;font:10.5px var(--f-body);color:var(--muted)}
.settle p{margin:3px 0 0;font:italic 11.5px var(--f-body);color:#dbe4ff;max-width:65ch}
.settle.done{background:linear-gradient(#2f5a2a,#1d3a1a);border-color:#7fcf6e #0c1a0a #0c1a0a #7fcf6e}
.settle.done b::after{content:"  \2605 settled";font:bold 10px var(--f-body);color:#9cf28a}
.settle.lock{filter:grayscale(.8) brightness(.6)}

/* chronicle */
.chron{display:grid;gap:6px;max-width:70ch}
.ce{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:6px 8px;background:rgba(0,0,0,.3);border:1px solid #24407a}
.ce .y{font:bold 10.5px var(--f-mono);color:var(--acc);padding-top:2px}
.ce b{font:400 15px var(--f-disp);display:block;color:#fff;text-shadow:var(--outline)}
.ce p{margin:2px 0 0;font:11.5px/1.5 var(--f-body);color:var(--muted)}

/* fold */
.foldBox{padding:12px;background:linear-gradient(#3a2766,#1d1440);border:3px solid;border-color:#8c6fd6 #120a2a #120a2a #8c6fd6;border-radius:4px;display:grid;gap:6px;text-align:center}
.foldBox .big{font:400 32px/1 var(--f-disp);color:#fff;text-shadow:var(--outline),0 0 14px #b38cff}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font:11px var(--f-mono);color:var(--muted);max-width:420px;padding:6px 8px;background:rgba(0,0,0,.3);border:1px solid #24407a}
.stats dd{margin:0;color:#fff;text-align:right;font-weight:bold}
.leg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 9px;margin-bottom:3px;background:linear-gradient(#2b2257,#181338);border:2px solid;border-color:#6a55b0 #0b0820 #0b0820 #6a55b0;border-radius:3px}
.leg b{font:400 15px var(--f-disp);color:#fff;text-shadow:var(--outline)}
.leg small{display:block;font:11px var(--f-body);color:#c8bdf0}
.leg.own{background:linear-gradient(#4a3a8a,#2b2257)}

/* overlays */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;background:linear-gradient(#22396f,#152653);border:3px solid;border-color:var(--bevelHi) var(--bevelLo) var(--bevelLo) var(--bevelHi);box-shadow:0 0 0 1px #000,0 6px 20px rgba(0,0,0,.6);border-radius:4px;padding:8px 14px;max-width:min(460px,calc(100% - 32px));font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s;text-align:center}
#toast.on{opacity:1}
#toast b{font:400 17px var(--f-disp);display:block;color:var(--acc);text-shadow:var(--outline)}
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,10,.75);padding:16px}
.dlg{width:min(440px,100%);max-height:90%;overflow-y:auto;background:linear-gradient(180deg,var(--panel2),var(--panel) 60px);border:3px solid;border-color:var(--bevelHi) var(--bevelLo) var(--bevelLo) var(--bevelHi);box-shadow:0 0 0 1px #000,0 10px 40px #000;border-radius:5px;padding:0 0 16px;text-align:center}
.dlg .ey{font:bold 10.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#fff;padding:5px 10px;background:linear-gradient(90deg,#3b62b0,#5a86d8,#3b62b0);text-shadow:1px 1px 0 #000}
.dlg h2{margin:12px 16px 6px;font:400 28px/1.1 var(--f-disp);color:#fff;text-shadow:var(--outline)}
.dlg p{margin:6px 18px 12px;font:12px/1.6 var(--f-body);color:var(--muted)}
.fly{position:absolute;pointer-events:none;font:400 18px var(--f-disp);color:#fff;text-shadow:var(--outline);animation:fly 1s ease-out forwards;z-index:4;white-space:nowrap}
@keyframes fly{to{transform:translateY(-60px);opacity:0}}

/* desktop: three cabinet columns */
@media (min-width:1000px){
  #app{grid-template-columns:380px minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);gap:12px}
  #left{grid-column:1;grid-row:1;display:grid;grid-template-rows:auto auto auto;align-content:start;gap:8px;min-height:0;padding:8px;background:linear-gradient(180deg,var(--panel2),var(--panel) 40px);border:3px solid;border-color:var(--bevelHi) var(--bevelLo) var(--bevelLo) var(--bevelHi);border-radius:4px;box-shadow:0 0 0 1px #000}
  #globeWrap{max-height:none}
  #bottom{grid-column:2;grid-row:1}
  #storeCol{grid-column:3;grid-row:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:#2a1708;border:3px solid;border-color:#b98352 #2b170a #2b170a #b98352;border-radius:4px;box-shadow:0 0 0 1px #000}
  #storeHead{margin:0;border-radius:0;background:linear-gradient(#8a5a32,#5a3519);font-size:20px;justify-content:center}
  #storeCol .sec{display:block!important;background:repeating-linear-gradient(180deg,#3a2210 0 60px,#311c0c 60px 62px);border:0}
  .tab[data-tab=store]{display:none}
  .fmap svg{max-height:380px}
}
@media (max-width:999px){
  #app{grid-template-rows:auto auto auto auto minmax(0,1fr);grid-template-areas:"top" "stage" "ticker" "tabs" "panel";gap:6px}
  #left,#bottom,#storeCol{display:contents}
  #top{grid-area:top}#stage{grid-area:stage}#ticker{grid-area:ticker}#tabs{grid-area:tabs;margin-bottom:-6px}.sec{grid-area:panel}
  #storeHead{display:none}
  #globeWrap{max-height:32vh;width:auto}
  #clickLabel{bottom:0}
  .tab{padding:6px 4px 4px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){#ticker span,#anomaly,#anomaly::after{animation:none}#ticker span{padding-left:0}}
</style>

<div id="app">
  <div id="left">
    <div id="top"><button id="mute" class="mute" aria-pressed="false" aria-label="Mute sound"></button>
      <div class="eraLine"><b id="eraName">Stone Age</b><span id="eraYear">~400,000 BCE</span></div>

const has=t=>!!S.techs[t];
function impCount(id){let n=0;for(let k=0;k<TIERS.length;k++)if(S.imps[id+k])n++;return n;}
function genMult(id){let m=Math.pow(2,impCount(id));for(const t of TECH_IDS)if(S.techs[t]&&TECHS[t].e.gen&&TECHS[t].e.gen[id])m*=TECHS[t].e.gen[id];return m;}
function genEach(id){return GI[id].cps*genMult(id)*globalMult();}
function globalMult(noBuff){
  let m=1+.01*S.earned;
  for(const t of TECH_IDS)if(S.techs[t]&&TECHS[t].e.global)m*=TECHS[t].e.global;
  for(const f of FRONT)if(S.front[f.id])m*=f.m;
  if(S.legacy.twin)m*=2;if(S.legacy.archive)m*=5;
  if(!noBuff)for(const b of S.buffs)if(b.k==='eureka')m*=7;
  return m;
}
function rawCps(){let r=0;for(const g of GENS)r+=S.gens[g.id]*g.cps*genMult(g.id);return r;}

  let v=b*globalMult(true)+cps()*clickPct();

/* World stats follow history, not your score: each discovery carries the world's estimated power use and
   population in its year (invented beyond today). Between discoveries they ease toward the next one as you build.
   Kardashev uses Sagan's formula K = (log10 P - 6) / 10 with P in watts. */
/* Kardashev uses Sagan's formula on your output: K = (log10 P - 6) / 10, P in watts (joules per second). */
function kardashev(){const c=cps();return c>0?(Math.log10(c)-6)/10:null;}
/* Population from watts, age by age. Each age has a plausible population band. Entering an age starts
   you at the bottom of its band; within the age, population climbs with every doubling of your output
   (the first thousandfold of growth covers about two thirds of the band) and approaches, but never
   reaches, the next age's floor. Never falls within a timeline. */
const POPBAND=[[1e4,1e6],[1e6,5e7],[5e7,2.5e8],[2.5e8,4.5e8],[4.5e8,9e8],[9e8,1.8e9],[1.8e9,4.5e9],[4.5e9,8e9],[8e9,1e10],[1e10,1e11],[1e11,1e14],[1e14,1e17],[1e17,1e20]];
function population(){
  const e=era(),W=Math.max(1,rawCps()*globalMult(true));
  if(!(S.eraW>0)||S.eraWe!==e){if(S.eraWe===undefined)S.wPop=0;S.eraW=W;S.eraWe=e;}
  const[lo,hi]=POPBAND[e],x=Math.max(0,Math.log(W/S.eraW)/Math.log(1e3));
  const pop=lo*Math.pow(hi/lo,1-Math.exp(-x*1.1));
  if(!(S.wPop>=pop))S.wPop=pop;return S.wPop;
}
function earn(x){S.bank+=x;S.run+=x;S.all+=x;}
const ECHO0=1e12;
function pendingEchoes(){return Math.max(0,Math.floor(Math.pow(S.all/ECHO0,.25))-S.earned);}

    for(let i=0;i<TXW;i++){const lon=(i+.5)/TXW*TAU,x=cl*Math.cos(lon),z=cl*Math.sin(lon),y=sl;

function buildTex(){
  if(!ELEV)genWorld();

  const urban=[.0,.02,.05,.12,.3,.42,.55,.65,.72,.8][e];
  for(let j=0;j<TXH;j++){const lat=Math.abs(.5-(j+.5)/TXH)*180;
    for(let i=0;i<TXW;i++){
      const k=j*TXW+i,h=ELEV[k];let r,g,b;
      const capN=fbm(i/18+2,j/18,6,2);
      if(lat>66+12*capN||(lat>56+10*capN&&h>.5)){r=228;g=238;b=246;}
      else if(h<.52){const d=(.52-h)/.25;r=14+20*(1-d);g=50+50*(1-d);b=95+60*(1-d);if(h>.5){r+=20;g+=30;b+=20;}}

        else{r=58+70*t;g=98+30*t;b=50+30*t;}

let PIX=null,PD=0,IMG=null,OFF=null,OFFX=null;
function prepSphere(){

    const nx=(x+.5-r)/r,ny=(y+.5-r)/r,d=nx*nx+ny*ny;if(d>1)continue;
    const nz=Math.sqrt(1-d),lat=Math.asin(-ny),lon=Math.atan2(nx,nz);

    list.push(y*PD+x,lon/TAU*TXW,Math.min(TXH-1,Math.max(0,Math.floor((.5-lat/Math.PI)*TXH))),light,1-nz);
  }

}
let rot=0,cloudRot=0,bump=0;
const sats=[],sparks=[];
for(let k=0;k<26;k++)sats.push({a:Math.random()*TAU,s:.3+Math.random()*.5,inc:(Math.random()-.5)*1.2,r:1.12+Math.random()*.25});
function renderSphere(){
  const data=IMG.data,e=vstage();data.fill(0);
  const ro=rot*TXW/TAU,cr=cloudRot*TXW/TAU,cloudThr=.56;
  for(let p=0;p<PIX.length;p+=5){
    const idx=PIX[p],u0=PIX[p+1],v=PIX[p+2],light=PIX[p+3],rim=PIX[p+4];
    const u=((Math.floor(u0+ro)%TXW)+TXW)%TXW,k=v*TXW+u,k3=k*3;
    const day=Math.max(0,Math.min(1,(light+.08)*3.2)),diff=Math.max(.05,light);
    let r=TEX[k3]*diff,g=TEX[k3+1]*diff,b=TEX[k3+2]*diff;
    const uc=((Math.floor(u0+cr)%TXW)+TXW)%TXW,c=CLOUD[v*TXW+uc];

    const L=LIGHTS[k]*(1-day)*(1-cl*.7);

  let h='<div class="lbl"><span>Improvements</span></div>';
  const imps=impList();
  const shown=showAllImps?imps:imps.slice(0,4);
  if(!imps.length)h+='<p class="sub">Own more buildings to unlock improvements.</p>';
  for(const it of shown)h+='<div class="imp"><span class="gico">'+svgI(it.ico)+'</span><div style="min-width:0"><b>'+esc(it.n)+'</b><small>'+esc(it.d)+'</small></div><button class="btn" data-imp="'+it.id+'" data-cost="'+it.cost+'">'+fmt(it.cost)+'</button></div>';
  if(imps.length>4)h+='<button class="more" data-more="1">'+(showAllImps?'Show fewer':'Show all '+imps.length)+'</button>';
  h+='<div class="lbl"><span>Buildings</span><span class="buyAmt">'+[1,10,100,'max'].map(n=>'<button data-amt="'+n+'" aria-pressed="'+(buyN===n)+'">'+(n==='max'?'Max':'×'+n)+'</button>').join('')+'</span></div>';
  let lockedShown=false;
  for(const g of GENS){
    if(!genUnlocked(g)){
      if(lockedShown)break;lockedShown=true;
      h+='<button class="gen locked" disabled><span class="gico">'+svgI(g.id)+'</span><span style="min-width:0"><span class="gn">'+esc(g.name)+'</span><span class="gi">Research '+esc(TECHS[g.req].n)+' to unlock</span></span><span class="gown"></span></button>';
      continue;
    }
    const n=buyN==='max'?Math.max(1,maxAfford(g.id)):buyN;
    const each=genEach(g.id),tot=each*S.gens[g.id],share=cps()>0?tot/cps()*100:0;
    h+='<button class="gen" data-gen="'+g.id+'" data-n="'+n+'"><span class="gico">'+svgI(g.id)+'</span><span style="min-width:0"><span class="gn">'+esc(g.name)+(n>1?' <span class="gc">×'+n+'</span>':'')+'</span><span class="gc" data-gcost="'+g.id+'">'+fmt(genCost(g.id,n))+'</span><span class="gi" title="'+esc(g.desc)+'">'+(S.gens[g.id]?fmt(each)+'/s each · '+(share>=.1?share.toFixed(1):'<0.1')+'% of output':esc(g.desc))+'</span></span><span class="gown">'+S.gens[g.id]+'</span></button>';
  }
  return h;
}
function refreshStore(){
  const el=$('sec-store');if(el.hidden)return;
  if(storeDirty&&!held){el.innerHTML=storeHTML();storeDirty=false;}
  el.querySelectorAll('[data-gen]').forEach(b=>{const id=b.dataset.gen,n=+b.dataset.n,c=genCost(id,n),ok=S.bank>=c;b.classList.toggle('can',ok);b.classList.toggle('cant',!ok);});
  el.querySelectorAll('[data-imp]').forEach(b=>{b.disabled=S.bank<+b.dataset.cost;});
}
$('sec-store').addEventListener('click',e=>{
  let x;
  if((x=e.target.closest('[data-gen]'))){buyGen(x.dataset.gen);return;}
  if((x=e.target.closest('[data-imp]'))){buyImp(x.dataset.imp);return;}
  if((x=e.target.closest('[data-amt]'))){buyN=x.dataset.amt==='max'?'max':+x.dataset.amt;storeDirty=true;return;}
  if(e.target.closest('[data-more]')){showAllImps=!showAllImps;storeDirty=true;}
});

/* research: a vertical tree. Era strip on top, a "ready now" shelf, then every era as a section.
   Each discovery lists what it requires and what it leads to; tapping either jumps to that card. */
function techState(t){if(S.techs[t])return 'own';if(TECHS[t].req.every(has))return S.bank>=techCost(t)?'can':'avail';return 'lock';}
const LEADS={};for(const t of TECH_IDS)for(const r of TECHS[t].req)(LEADS[r]=LEADS[r]||[]).push(t);
const eraTechs=e=>TECH_IDS.filter(t=>TECHS[t].ea===e);
const openEras={};
function chip(t){const st=techState(t);return '<button class="tchip '+st+'" data-jump="'+t+'">'+(st==='own'?'✓ ':'')+esc(TECHS[t].n)+'</button>';}
function techCard(t,shelf){
  const T=TECHS[t],st=techState(t),c=techCost(t);
  let h='<div class="tcard '+st+'" id="tc-'+(shelf?'s-':'')+t+'"><div class="tmain"><div class="thead"><span class="tst">'+(st==='own'?'✓':st==='lock'?'•':'★')+'</span><b>'+esc(T.n)+'</b><span class="yr">'+esc(T.y)+'</span></div>';
  if(st!=='lock'||shelf)h+='<p class="fl">'+esc(T.f)+'</p>';
  h+='<p class="eff">'+esc(T.d)+'</p>';
  if(T.req.length)h+='<div class="links"><span>Requires</span>'+T.req.map(chip).join('')+'</div>';
  if(LEADS[t]&&!shelf)h+='<div class="links"><span>Leads to</span>'+LEADS[t].map(chip).join('')+'</div>';
  h+='</div>';
  if(st==='can'||st==='avail')h+='<div class="tbuy"><button class="btn" data-research="'+t+'" data-cost="'+c+'"'+(st==='can'?'':' disabled')+'>Research<br>'+fmt(c)+'</button><small class="eta" data-eta="'+c+'"></small></div>';
  return h+'</div>';
}
function treeHTML(){
  const cur=era();
  let h='<h2 class="sh">Research</h2><div class="estrip">';
  for(let e=0;e<ERAS.length;e++){const ts=eraTechs(e),k=ts.filter(has).length;h+='<button class="eseg'+(e===cur?' cur':'')+(k===ts.length?' done':'')+'" data-era="'+e+'" title="'+ERAS[e].name+'"><i style="height:'+Math.round(k/ts.length*100)+'%"></i><span>'+(e+1)+'</span></button>';}
  h+='</div>';
  const ready=TECH_IDS.filter(t=>{const s=techState(t);return s==='can'||s==='avail';}).sort((a,b)=>techCost(a)-techCost(b));
  h+='<div class="lbl"><span>Ready to research</span><span>'+ready.length+'</span></div>';
  h+=ready.length?ready.map(t=>techCard(t,true)).join(''):'<p class="sub">Every discovery is known. Fold time to begin again.</p>';
  h+='<div class="lbl"><span>The tree</span><span>'+TECH_IDS.filter(has).length+' of '+TECH_IDS.length+' known</span></div>';
  for(let e=0;e<ERAS.length;e++){
    const ts=eraTechs(e),k=ts.filter(has).length;
    const open=openEras[e]!=null?openEras[e]:(e===cur||e===cur+1);
    h+='<details class="era" id="era-'+e+'" data-e="'+e+'"'+(open?' open':'')+'><summary><span>'+ERAS[e].name+'</span><small>'+k+' / '+ts.length+'</small></summary>'+ts.map(t=>techCard(t,false)).join('')+'</details>';
  }
  return h;
}
let treeFocus=false;
function refreshTree(){
  const el=$('sec-tech');if(el.hidden)return;
  if(treeDirty&&!held){const top=el.scrollTop;el.innerHTML=treeHTML();el.scrollTop=top;treeDirty=false;treeFocus=false;}
  const c=cps();
  el.querySelectorAll('[data-research]').forEach(b=>{const ok=S.bank>=+b.dataset.cost;b.disabled=!ok;b.closest('.tcard').classList.toggle('can',ok);});
  el.querySelectorAll('[data-eta]').forEach(s=>{const need=+s.dataset.eta-S.bank;s.textContent=need>0&&c>0?'in '+fmtT(need/c):'';});
}
function jumpTo(t){
  const e=TECHS[t].ea,d=$('era-'+e);if(!d)return;
  d.open=true;openEras[e]=true;
  const card=$('tc-'+t);if(!card)return;
  card.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});
  card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash');
}
$('sec-tech').addEventListener('click',e=>{
  let x;
  if((x=e.target.closest('[data-research]'))){research(x.dataset.research);return;}
  if((x=e.target.closest('[data-jump]'))){jumpTo(x.dataset.jump);return;}
  if((x=e.target.closest('[data-era]'))){const k=+x.dataset.era,d=$('era-'+k);if(d){d.open=true;openEras[k]=true;d.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});}return;}
});
$('sec-tech').addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.era'))openEras[+d.dataset.e]=d.open;},true);

/* frontier */
function frontMap(){
  let s='<svg viewBox="0 0 400 300" role="img" aria-label="Map of the Solar System and nearby stars">';
  const cx=140,cy=150;
  s+='<defs><radialGradient id="sun"><stop offset="0" stop-color="#fff6c8"/><stop offset=".5" stop-color="#ffd36a"/><stop offset="1" stop-color="#ffd36a" stop-opacity="0"/></radialGradient></defs>';
  const rr=o=>14+22*Math.log2(1+o);
  for(const f of FRONT.filter(f=>f.k==='sol'&&f.id!=='leo'&&f.id!=='moon'&&f.id!=='oort'))s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rr(f.o).toFixed(1)+'" fill="none" stroke="#27243d" stroke-width=".7"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(rr(2000)).toFixed(1)+'" fill="none" stroke="#27243d" stroke-width="5" stroke-dasharray="1 4" opacity=".7"/>';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="14" fill="url(#sun)"/><circle cx="'+cx+'" cy="'+cy+'" r="4" fill="#fff3c0"/>';
  const ang={leo:0,moon:0,mars:300,venus:140,belt:40,jovian:200,saturn:110,mercury:250,icegiants:20,kuiper:160,oort:230};
  const er=rr(1),ea=0;
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+er.toFixed(1)+'" fill="none" stroke="#27243d" stroke-width=".7"/>';
  const ex=cx+er,ey=cy;s+='<circle cx="'+ex+'" cy="'+ey+'" r="4" fill="#5fa0ff"/><text x="'+(ex+7)+'" y="'+(ey+14)+'" font-family="JetBrains Mono,monospace" font-size="8" fill="#a49cb8">Earth</text>';
  const dot=(x,y,on,can,lbl,anchor)=>(can?'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="8" fill="none" stroke="var(--acc)" stroke-width="1"><animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite"/></circle>':'')+'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(on?4:2.6)+'" fill="'+(on?'var(--acc)':'#4a4566')+'"/>'+(lbl?'<text x="'+(x+(anchor==='end'?-7:7)).toFixed(1)+'" y="'+(y+3).toFixed(1)+'"'+(anchor==='end'?' text-anchor="end"':'')+' font-family="JetBrains Mono,monospace" font-size="8" fill="'+(on?'#efe8d8':'#6c6688')+'">'+esc(lbl)+'</text>':'');
  for(const f of FRONT.filter(f=>f.k==='sol')){
    const on=!!S.front[f.id],can=!on&&has(f.req);
    let x,y,lbl=f.n.replace(/^The /,'');
    if(f.id==='leo'){x=ex+6;y=ey-6;lbl='';}
    else if(f.id==='moon'){x=ex+10;y=ey+4;lbl='';}
    else{const r=f.id==='oort'?rr(2000):rr(f.o),a=ang[f.id]*Math.PI/180;x=cx+Math.cos(a)*r;y=cy+Math.sin(a)*r;}
    s+=dot(x,y,on,can,lbl);
  }
  /* local stars to the right, distance to scale in light years */
  s+='<line x1="268" y1="20" x2="268" y2="280" stroke="#27243d" stroke-dasharray="2 4"/><text x="276" y="22" font-family="Fraunces,serif" font-style="italic" font-size="11" fill="#6c6688">Nearby stars</text>';
  for(const f of FRONT.filter(f=>f.k==='star')){
    const on=!!S.front[f.id],can=!on&&has(f.req);
    const d=f.ly/12,a=(f.ang-90)*Math.PI/180;const x=300+Math.cos(a)*d*40+20,y=150+Math.sin(a)*d*110;
    s+=dot(x,y,on,can,f.n.replace("Barnard's Star","Barnard")+' '+f.ly+' ly',x>350?'end':'start');
  }
  return s+'</svg>';
}
function frontHTML(){
  let h='<h2 class="sh">Frontier</h2><p class="sub">Each settlement multiplies everything. Solar System worlds give ×1.1 to ×1.15, star systems ×1.25 to ×1.3.</p><div class="fmap" id="fmap">'+frontMap()+'</div>';
  const next=FRONT.filter(f=>!S.front[f.id]);
  h+='<div class="lbl"><span>Settlements</span><span>'+(FRONT.length-next.length)+' of '+FRONT.length+'</span></div>';
  for(const f of FRONT){
    const on=!!S.front[f.id],can=has(f.req);
    h+='<div class="settle'+(on?' done':can?'':' lock')+'"><div style="min-width:0"><b>'+esc(f.n)+'</b><small>'+(f.k==='star'?f.ly+' light years':'Solar System')+' · everything ×'+f.m+(can||on?'':' · needs '+esc(TECHS[f.req].n))+'</small>'+(on||can?'<p>'+esc(f.f)+'</p>':'')+'</div>'+(on?'':can?'<button class="btn" data-settle="'+f.id+'" data-cost="'+f.cost+'">'+fmt(f.cost)+'</button>':'')+'</div>';
  }
  return h;
}
function refreshFront(){const el=$('sec-frontier');if(el.hidden)return;if(frontDirty&&!held){el.innerHTML=frontHTML();frontDirty=false;}el.querySelectorAll('[data-settle]').forEach(b=>{b.disabled=S.bank<+b.dataset.cost;});}
$('sec-frontier').addEventListener('click',e=>{const x=e.target.closest('[data-settle]');if(x)settle(x.dataset.settle);});

/* chronicle */
function refreshChron(){
  const el=$('sec-chron');if(el.hidden||!chronDirty)return;
  el.innerHTML='<h2 class="sh">Chronicle</h2><p class="sub">The story so far, newest first.</p><div class="chron">'+S.chron.slice().reverse().map(c=>'<div class="ce"><span class="y">'+esc(c.y)+(S.folds?'<br>timeline '+c.tl:'')+'</span><div><b>'+esc(c.t)+'</b><p>'+esc(c.x)+'</p></div></div>').join('')+'</div>';
  chronDirty=false;
}

/* fold */
let foldSig='';
function refreshFold(){
  const el=$('sec-fold');if(el.hidden||held)return;
  const p=pendingEchoes(),need=Math.pow(Math.floor(Math.pow(S.all/ECHO0,.25))+1,4)*ECHO0;
  let h='<h2 class="sh">Fold time</h2><p class="sub">Collapse this timeline and begin again at the first campfire. You keep Echoes: each one permanently adds 1% to everything, and can also be spent on Legacy. Echoes come from all the '+CUR+' you have ever produced.</p>';
  h+='<div class="foldBox"><span class="mono" style="color:var(--muted);font-size:12px">Folding now would grant</span><span class="big">'+fmt(p)+' echoes</span><span class="mono" style="color:var(--muted);font-size:12px">Next echo at '+fmt(need,true)+' total '+CUR+' · you have produced '+fmt(S.all,true)+'</span><div><button class="btn big" data-fold="1"'+(p<1?' disabled':'')+'>'+(foldArm&&Date.now()<foldArm?'Tap again to fold time':'Fold time')+'</button></div></div>';
  h+='<div class="lbl"><span>Legacy</span><span>'+fmt(S.echoes)+' echoes to spend · +'+fmt(S.earned)+'% bonus</span></div>';
  for(const L of LEGACY){const own=!!S.legacy[L.id];h+='<div class="leg'+(own?' own':'')+'"><div><b>'+esc(L.n)+'</b><small>'+esc(L.d)+'</small></div>'+(own?'<span class="mono" style="color:var(--acc);font-size:11px">owned</span>':'<button class="btn" data-legacy="'+L.id+'"'+(S.echoes<L.cost?' disabled':'')+'>'+L.cost+' echo'+(L.cost>1?'es':'')+'</button>')+'</div>';}
  h+='<div class="lbl"><span>Statistics</span></div><dl class="stats"><dt>This timeline</dt><dd>'+fmt(S.run)+'</dd><dt>All timelines</dt><dd>'+fmt(S.all)+'</dd><dt>Clicks</dt><dd>'+S.clicks.toLocaleString('en-US')+'</dd><dt>From clicks</dt><dd>'+fmt(S.clickEarned)+'</dd><dt>Buildings</dt><dd>'+GENS.reduce((a,g)=>a+S.gens[g.id],0)+'</dd><dt>Discoveries</dt><dd>'+TECH_IDS.filter(has).length+' of '+TECH_IDS.length+'</dd><dt>Worlds and stars settled</dt><dd>'+FRONT.filter(f=>S.front[f.id]).length+' of '+FRONT.length+'</dd><dt>Times folded</dt><dd>'+S.folds+'</dd><dt>Time played</dt><dd>'+fmtT(S.play)+'</dd></dl>';
  h+='<p class="sub" style="margin-top:12px"><button class="more" data-snd="1">'+(S.muted?'Turn sound on':'Turn sound off')+'</button> · <button class="more" data-wipe="1">'+(wipeArm&&Date.now()<wipeArm?'Tap again to erase everything':'Erase all progress')+'</button></p>';
  if(h!==foldSig||foldDirty){el.innerHTML=h;foldSig=h;foldDirty=false;}
}
let wipeArm=0;
$('sec-fold').addEventListener('click',e=>{
  let x;
  if(e.target.closest('[data-fold]')){fold();foldDirty=true;return;}
  if((x=e.target.closest('[data-legacy]'))){buyLegacy(x.dataset.legacy);return;}
  if(e.target.closest('[data-snd]')){S.muted=!S.muted;renderMute();foldDirty=true;return;}
  if(e.target.closest('[data-wipe]')){if(wipeArm&&Date.now()<wipeArm){try{localStorage.removeItem(KEY);}catch(err){}S=fresh();intro();applyEra();storeDirty=treeDirty=frontDirty=chronDirty=foldDirty=true;wipeArm=0;}else{wipeArm=Date.now()+4000;foldDirty=true;}}
});
const markHeld=()=>{held=true;};
['sec-store','sec-tech','sec-frontier','sec-fold'].forEach(id=>$(id).addEventListener('pointerdown',markHeld,true));
window.addEventListener('pointerup',()=>setTimeout(()=>{held=false;},0));window.addEventListener('pointercancel',()=>{held=false;});

/* mute */
function renderMute(){const m=S.muted,b=$('mute');b.setAttribute('aria-pressed',String(m));b.setAttribute('aria-label',m?'Unmute sound':'Mute sound');
  b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/>'+(m?'<path d="M17 9l5 6M22 9l-5 6"/>':'<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>')+'</svg>'+(m?'Muted':'Sound');}
$('mute').addEventListener('click',()=>{S.muted=!S.muted;renderMute();foldDirty=true;if(!S.muted)sfx('buy');save();});
/* header */
function refreshTop(){
  $('bank').innerHTML=esc(fmt(S.bank,true))+'<small>'+CUR+'</small>';
  $('pop').textContent='~'+fmt(population());$('cps').textContent=fmt(cps());$('cpc').textContent=fmt(clickVal());{const k=kardashev();$('kard').textContent=k==null?'\u2014':(k<0?'\u2212':'')+Math.abs(k).toFixed(3);}
  const bh=S.buffs.map(b=>'<span class="buff">'+esc(b.label)+' · '+Math.ceil(b.until-S.play)+'s</span>').join('');
  if($('buffs').innerHTML!==bh)$('buffs').innerHTML=bh;
  const pip=(t,on)=>{const i=document.querySelector('.tab[data-tab='+t+'] i');if(i)i.hidden=!on;};
  pip('tech',TECH_IDS.some(t=>techState(t)==='can'));
  pip('frontier',FRONT.some(f=>!S.front[f.id]&&has(f.req)&&S.bank>=f.cost));
  pip('fold',pendingEchoes()>=Math.max(1,S.earned*.5));
  pip('store',impList().some(i=>S.bank>=i.cost));
  document.title=fmt(S.bank)+' · The Long Ascent';
}

/* =========================== LOOP =========================== */
let storeT=0,uiT=0,saveT=0,last=performance.now(),lastGenCount=-1;
function tick(dt){
  S.play+=dt;S.runT=(S.runT||0)+dt;
  earn(cps()*dt);
  S.buffs=S.buffs.filter(b=>b.until>S.play);
  if(anom){anom.t+=dt;if(anom.t>anom.life*(has('chronon')?1.5:1)){$('anomaly').hidden=true;anom=null;}}
  else if(S.runT>=300){S.anomNext-=dt;if(S.anomNext<=0){S.anomNext=anomInterval();spawnAnomaly();}}
}
function frame(now){
  let dt=Math.min(1,(now-last)/1000);last=now;
  tick(dt);
  drawGlobe(dt);
  uiT+=dt;if(uiT>.1){uiT=0;refreshTop();}
  storeT+=dt;if(storeT>.25){storeT=0;
    const gc=GENS.reduce((a,g)=>a+S.gens[g.id],0)+Object.keys(S.imps).length;if(gc!==lastGenCount){lastGenCount=gc;storeDirty=true;}
    if(Math.floor(S.play)%2===0&&!held)storeDirty=storeDirty||Math.random()<.15;
    refreshStore();refreshTree();refreshFront();refreshChron();refreshFold();}
  saveT+=dt;if(saveT>5){saveT=0;save();}
  requestAnimationFrame(frame);
}
function intro(){
  S.chron.push({y:'~2,000,000 BCE',t:'The first spark',x:'A cold night on the savanna. Somebody bangs two stones together, and something catches. Tap the Earth to gather '+CUR+', and spend it on foragers who will gather it for you.',tl:S.timeline});
}
function boot(){
  const d=load();
  if(d){S=Object.assign(fresh(),d);GENS.forEach(g=>{if(S.gens[g.id]==null)S.gens[g.id]=0;});}
  else{S=fresh();startRun();intro();}
  S.buffs=(S.buffs||[]).filter(b=>b.until>S.play);
  applyEra();resizeGlobe();renderMute();
  setTab(desktop()?'tech':'store');
  if(!d)showDlg('2,000,000 years to go','The Long Ascent','<p>A cold night on the savanna. Somebody strikes two stones together, and something catches.</p><p>Tap the Earth to gather '+CUR+'. Hire foragers to gather it for you, research your way to the stars, and when the climb slows, fold time and start again stronger.</p>');
  if(window.ResizeObserver)new ResizeObserver(resizeGlobe).observe($('globeWrap'));
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else last=performance.now();});
window.addEventListener('pagehide',save);
window.__ascent={TECH_IDS,TECHS,GENS,CLICK0,population,kardashev,genCost,genEach,get S(){return S;},cps,clickVal,buyGen:(id,n)=>{const o=buyN;buyN=n||1;buyGen(id);buyN=o;},research,settle,fold,impList,buyImp,tick,earn,era,techCost};
boot();
})();
</script>
